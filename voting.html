
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voting | Psychological Scale Exhibition</title>

<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --blue: #1464c4;
    --blue-deep: #075487;
    --light-blue: #b9d3ef;
    --very-light-blue: #eef6fc;
    --white: #fff;
    --black: #111;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html { scroll-behavior: smooth; }

body {
    width: 100%;
    min-height: 100vh;
    font-family: 'Montserrat', Arial, sans-serif;
    color: var(--black);
    background:
        linear-gradient(rgba(244,249,253,.4), rgba(244,249,253,.4)),
        url("assets/background.png") center / cover fixed no-repeat;
    overflow-x: hidden;
}

button, input { font: inherit; }

.top-scroll-protection {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 115px;
    background: linear-gradient(
        to bottom,
        rgba(238,246,252,1) 0%,
        rgba(238,246,252,1) 42%,
        rgba(238,246,252,.96) 52%,
        rgba(238,246,252,.78) 65%,
        rgba(238,246,252,.45) 80%,
        rgba(238,246,252,.18) 91%,
        transparent 100%
    );
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    z-index: 1100;
    transition: opacity .25s, visibility .25s;
}

.top-scroll-protection.active {
    opacity: 1;
    visibility: visible;
}

body.menu-open .top-scroll-protection {
    opacity: 0;
    visibility: hidden;
}

.menu-button {
    position: fixed;
    top: 38px;
    left: 30px;
    width: 64px;
    height: 48px;
    padding: 4px 0;
    border: none;
    background: transparent;
    cursor: pointer;
    z-index: 1300;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.menu-button span {
    display: block;
    width: 64px;
    height: 5px;
    background: var(--blue-deep);
    transition: transform .35s, opacity .25s, background .25s;
}

.menu-button.active span:nth-child(1) {
    transform: translateY(17px) rotate(45deg);
    background: var(--white);
}

.menu-button.active span:nth-child(2) { opacity: 0; }

.menu-button.active span:nth-child(3) {
    transform: translateY(-17px) rotate(-45deg);
    background: var(--white);
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,38,66,.38);
    opacity: 0;
    visibility: hidden;
    transition: opacity .35s, visibility .35s;
    z-index: 1150;
}

.overlay.active {
    opacity: 1;
    visibility: visible;
}

.side-menu {
    position: fixed;
    top: 0;
    left: 0;
    width: 365px;
    max-width: 88vw;
    height: 100vh;
    background: var(--blue-deep);
    z-index: 1200;
    transform: translateX(-100%);
    transition: transform .4s;
    overflow-y: auto;
    overflow-x: hidden;
    box-shadow: 8px 0 30px rgba(0,0,0,.12);
}

.side-menu.active { transform: translateX(0); }

.side-menu-inner { padding: 118px 43px 55px; }

.menu-label, .menu-section-title {
    margin-bottom: 22px;
    color: rgba(255,255,255,.55);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
}

.menu-section { margin-top: 34px; }
.menu-section-title { margin-bottom: 3px; }

.menu-link {
    display: block;
    width: 100%;
    padding: 16px 0;
    border-bottom: 1px solid rgba(255,255,255,.2);
    color: var(--white);
    text-decoration: none;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    transition: color .25s, padding-left .25s;
}

.menu-link:hover {
    color: #dcecff;
    padding-left: 7px;
}

.voting-page {
    width: 100%;
    min-height: 100vh;
    padding: 55px 6% 80px;
}

.header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 30px;
}

.exhibition-title {
    margin-bottom: 10px;
    font-size: clamp(14px, 1.5vw, 20px);
    font-weight: 500;
}

.header h1 {
    max-width: 1000px;
    font-family: 'League Spartan', sans-serif;
    font-size: clamp(58px, 7vw, 108px);
    font-weight: 800;
    letter-spacing: -3px;
    line-height: .9;
    color: var(--blue);
    text-transform: uppercase;
}

.name-wrapper {
    width: min(660px, 90%);
    margin: 30px auto 50px;
}

.name-input {
    width: 100%;
    padding: 18px 30px;
    border: 2px solid transparent;
    border-radius: 50px;
    background: rgba(185,211,239,.96);
    color: var(--black);
    font-size: 21px;
    font-weight: 500;
    text-align: center;
    outline: none;
    transition: transform .3s, box-shadow .3s;
}

.name-input::placeholder { color: var(--black); opacity: 1; }

.name-input:focus {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(7,84,135,.14);
}

.name-input:focus-visible { border-color: var(--blue); }

.name-input:disabled {
    opacity: .65;
    cursor: not-allowed;
}

.instruction {
    max-width: 800px;
    margin: 0 auto 40px;
    text-align: center;
    font-size: clamp(14px, 1.2vw, 18px);
    line-height: 1.55;
}

.instruction strong { font-weight: 800; }

.poster-grid {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 55px 5%;
    align-items: start;
}

.poster-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-width: 0;
}

.poster-select {
    position: relative;
    width: 100%;
    max-width: 280px;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    transition: transform .3s;
}

.poster-select img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: .75 / 1;
    object-fit: cover;
    box-shadow: 0 8px 20px rgba(0,0,0,.14);
    transition: transform .3s, box-shadow .3s, filter .3s;
}

.poster-select:hover:not(:disabled) {
    transform: translateY(-7px);
}

.poster-select:hover:not(:disabled) img {
    transform: scale(1.02);
    box-shadow: 0 18px 35px rgba(0,0,0,.26);
    filter: brightness(1.04);
}

.poster-select.selected img {
    box-shadow: 0 0 0 5px var(--blue), 0 15px 35px rgba(0,0,0,.3);
    filter: brightness(.78);
}

.poster-select:disabled {
    cursor: not-allowed;
}

.poster-select:focus-visible {
    outline: 3px solid var(--blue-deep);
    outline-offset: 7px;
}

.selection-number {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 43px;
    height: 43px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--blue);
    color: var(--white);
    font-family: 'League Spartan', sans-serif;
    font-size: 21px;
    font-weight: 800;
    opacity: 0;
    transform: scale(.5);
    transition: opacity .25s, transform .25s;
}

.poster-select.selected .selection-number {
    opacity: 1;
    transform: scale(1);
}

.poster-title {
    margin-top: 20px;
    color: var(--black);
    font-size: clamp(14px, 1.3vw, 20px);
    font-weight: 700;
    letter-spacing: 4px;
    text-decoration: underline;
    text-underline-offset: 6px;
}

.voting-status {
    min-height: 28px;
    margin-top: 35px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
}

.submit-wrapper {
    display: flex;
    justify-content: center;
    margin-top: 30px;
}

.submit-button, .bottom-back a {
    min-width: 290px;
    padding: 17px 35px;
    border: 3px solid var(--blue-deep);
    border-radius: 50px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 4px;
    text-align: center;
    transition: background .3s, color .3s, transform .3s, opacity .3s;
}

.submit-button {
    background: var(--blue-deep);
    color: var(--white);
    cursor: pointer;
}

.submit-button:hover:not(:disabled) {
    background: transparent;
    color: var(--blue-deep);
    transform: translateY(-3px);
}

.submit-button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.submit-button:focus-visible, .bottom-back a:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 5px;
}

.form-message {
    min-height: 25px;
    margin-top: 22px;
    text-align: center;
    color: var(--blue-deep);
    font-size: 15px;
    font-weight: 600;
    overflow-wrap: anywhere;
}

.form-message.error { color: #b42318; }
.form-message.success { color: #167447; }

.bottom-back {
    display: flex;
    justify-content: center;
    margin-top: 55px;
}

.bottom-back a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--blue-deep);
    text-decoration: none;
}

.bottom-back a:hover {
    background: var(--blue-deep);
    color: var(--white);
    transform: translateY(-3px);
}

@media (max-width: 1100px) {
    .poster-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 45px 5%;
    }
}

@media (max-width: 700px) {
    .top-scroll-protection { height: 105px; }

    .menu-button {
        top: 28px;
        left: 24px;
        width: 54px;
        height: 42px;
    }

    .menu-button span { width: 54px; height: 4px; }

    .menu-button.active span:nth-child(1) {
        transform: translateY(15px) rotate(45deg);
    }

    .menu-button.active span:nth-child(3) {
        transform: translateY(-15px) rotate(-45deg);
    }

    .side-menu-inner { padding: 105px 35px 50px; }
    .menu-link { font-size: 18px; }

    .voting-page { padding: 115px 25px 70px; }
    .header { margin-bottom: 25px; }
    .exhibition-title { font-size: 12px; }

    .header h1 {
        font-size: 54px;
        letter-spacing: -2px;
    }

    .name-wrapper { width: 100%; margin: 25px auto 40px; }
    .name-input { padding: 16px 20px; font-size: 17px; }
    .instruction { margin-bottom: 30px; font-size: 13px; }

    .poster-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 40px 8%;
    }

    .poster-select { max-width: 230px; }
    .poster-title { font-size: 12px; letter-spacing: 2px; }

    .selection-number {
        width: 35px;
        height: 35px;
        top: 8px;
        right: 8px;
        font-size: 17px;
    }

    .submit-button, .bottom-back a {
        min-width: 240px;
        padding: 15px 25px;
        font-size: 16px;
    }
}

@media (max-width: 450px) {
    .voting-page {
        padding-left: 20px;
        padding-right: 20px;
    }

    .header h1 { font-size: 48px; }

    .poster-grid {
        grid-template-columns: 1fr;
        gap: 50px;
    }

    .poster-select { max-width: 280px; }
    .poster-title { font-size: 14px; }
}
</style>
</head>

<body>

<div class="top-scroll-protection" id="scrollProtection"></div>
<div class="overlay" id="overlay"></div>

<button class="menu-button" id="menuButton" type="button"
        aria-label="Buka menu" aria-expanded="false">
    <span></span><span></span><span></span>
</button>

<aside class="side-menu" id="sideMenu">
    <div class="side-menu-inner">
        <div class="menu-label">EXPLORE</div>
        <a href="index.html" class="menu-link">Home</a>
        <a href="tentang.html" class="menu-link">Tentang Exhibition</a>
        <a href="profil-dosen.html" class="menu-link">Profil Dosen</a>
        <a href="profil-asisten.html" class="menu-link">Profil Asisten</a>

        <div class="menu-section">
            <div class="menu-section-title">TEMA</div>
            <a href="tema1.html" class="menu-link">Tema 1</a>
            <a href="tema2.html" class="menu-link">Tema 2</a>
            <a href="tema3.html" class="menu-link">Tema 3</a>
        </div>

        <div class="menu-section">
            <div class="menu-section-title">PARTICIPATE</div>
            <a href="voting.html" class="menu-link">Vote</a>
        </div>
    </div>
</aside>

<main class="voting-page">
    <header class="header">
        <div class="exhibition-title">Psychological Scale Exhibition</div>
        <h1>PICK YOUR<br>FAVOURITE</h1>
    </header>

    <div class="name-wrapper">
        <input type="text" id="voterName" class="name-input"
               placeholder="Tuliskan nama Anda" autocomplete="name"
               maxlength="100" aria-label="Nama pemilih">
    </div>

    <p class="instruction">
        Pilih <strong>3 poster</strong> yang ingin Anda pilih.
        <br>
        Poster yang dipilih akan diberi nomor urutan
        <strong>1, 2, dan 3.</strong>
    </p>

    <section class="poster-grid" id="posterGrid"></section>

    <div class="voting-status" id="votingStatus" aria-live="polite">
        0 / 3 poster dipilih
    </div>

    <div class="submit-wrapper">
        <button type="button" id="submitButton" class="submit-button" disabled>
            KIRIM
        </button>
    </div>

    <div class="form-message" id="formMessage" role="status" aria-live="polite"></div>

    <div class="bottom-back">
        <a href="index.html">KEMBALI</a>
    </div>
</main>

<!-- Iframe tersembunyi untuk mengirim POST tanpa fetch/CORS -->
<iframe name="votingTarget" id="votingTarget"
        title="Pengiriman voting" style="display:none"></iframe>

<script>
"use strict";

/*
 * GUNAKAN URL DEPLOYMENT WEB APP AKTIF.
 * Jika membuat deployment baru, periksa URL-nya kembali.
 */
const GOOGLE_SCRIPT_URL =
    "https://script.google.com/a/macros/student.ubaya.ac.id/s/AKfycbxIEltL6DfkOV2ryc4gNzRkCXf9lSmeIsfP4CrPWEbCL-7ORWS2gPRSRqHkIV8dRJ3X/exec";

const posterGrid = document.getElementById("posterGrid");
const nameInput = document.getElementById("voterName");
const submitButton = document.getElementById("submitButton");
const votingStatus = document.getElementById("votingStatus");
const formMessage = document.getElementById("formMessage");
const menuButton = document.getElementById("menuButton");
const sideMenu = document.getElementById("sideMenu");
const overlay = document.getElementById("overlay");
const scrollProtection = document.getElementById("scrollProtection");

let selectedPosters = [];
let isSubmitting = false;

// Pembatas voting sederhana pada browser yang sama.
const VOTING_STORAGE_KEY = "pse_voting_submitted_v1";
let hasVoted = localStorage.getItem(VOTING_STORAGE_KEY) === "true";

/* Buat 12 poster */
for (let number = 1; number <= 12; number++) {
    const item = document.createElement("div");
    item.className = "poster-item";

    const button = document.createElement("button");
    button.className = "poster-select";
    button.type = "button";
    button.dataset.poster = String(number);
    button.setAttribute("aria-pressed", "false");

    const img = document.createElement("img");
    img.src = `poster/${number}.jpg`;
    img.alt = `Poster ${number}`;
    img.loading = number > 4 ? "lazy" : "eager";

    const badge = document.createElement("span");
    badge.className = "selection-number";

    button.append(img, badge);
    button.addEventListener("click", () => selectPoster(button));

    const title = document.createElement("div");
    title.className = "poster-title";
    title.textContent = "LOREM IPSUM";

    item.append(button, title);
    posterGrid.appendChild(item);
}

/* Menu */
function openMenu() {
    menuButton.classList.add("active");
    sideMenu.classList.add("active");
    overlay.classList.add("active");
    menuButton.setAttribute("aria-expanded", "true");
    menuButton.setAttribute("aria-label", "Tutup menu");
    document.body.classList.add("menu-open");
    scrollProtection.classList.remove("active");
}

function closeMenu() {
    menuButton.classList.remove("active");
    sideMenu.classList.remove("active");
    overlay.classList.remove("active");
    menuButton.setAttribute("aria-expanded", "false");
    menuButton.setAttribute("aria-label", "Buka menu");
    document.body.classList.remove("menu-open");
    checkTopContentCollision();
}

menuButton.addEventListener("click", () => {
    sideMenu.classList.contains("active") ? closeMenu() : openMenu();
});

overlay.addEventListener("click", closeMenu);

document.querySelectorAll(".menu-link").forEach(link => {
    link.addEventListener("click", closeMenu);
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeMenu();
});

/* Gradient saat konten melewati bagian atas */
function checkTopContentCollision() {
    if (document.body.classList.contains("menu-open") || window.scrollY <= 10) {
        scrollProtection.classList.remove("active");
        return;
    }

    const height = window.innerWidth <= 700 ? 105 : 115;
    const elements = document.querySelectorAll(
        ".header, .name-wrapper, .instruction, .poster-item, " +
        ".voting-status, .submit-wrapper, .form-message, .bottom-back"
    );

    let collision = false;

    elements.forEach(element => {
        const rect = element.getBoundingClientRect();
        if (rect.top < height && rect.bottom > 0) collision = true;
    });

    scrollProtection.classList.toggle("active", collision);
}

window.addEventListener("scroll", checkTopContentCollision, { passive: true });
window.addEventListener("resize", checkTopContentCollision);

/* Status dan pesan */
function showMessage(message, type = "") {
    formMessage.textContent = message;
    formMessage.className = "form-message";

    if (type) {
        formMessage.classList.add(type);
    }
}

function clearMessage() {
    formMessage.textContent = "";
    formMessage.className = "form-message";
}

function updateVotingStatus() {
    votingStatus.textContent = hasVoted
        ? "Voting telah dilakukan"
        : `${selectedPosters.length} / 3 poster dipilih`;

    /*
     * Tombol tetap dapat diklik setelah voting agar jika peserta
     * mencoba submit ulang, pesan khusus dapat ditampilkan.
     */
    submitButton.disabled =
        isSubmitting || (!hasVoted && selectedPosters.length !== 3);

    submitButton.textContent = hasVoted
        ? "SUDAH VOTING"
        : (isSubmitting ? "MENGIRIM..." : "KIRIM");

    nameInput.disabled = hasVoted || isSubmitting;

    document.querySelectorAll(".poster-select").forEach(button => {
        button.disabled = hasVoted || isSubmitting;
    });
}

/* Pilih tepat 3 poster */
function selectPoster(button) {
    if (isSubmitting || hasVoted) return;

    const number = Number(button.dataset.poster);
    const index = selectedPosters.indexOf(number);

    if (index !== -1) {
        selectedPosters.splice(index, 1);
        clearMessage();
    } else {
        if (selectedPosters.length >= 3) {
            showMessage(
                "Anda sudah memilih 3 poster. Batalkan salah satu pilihan untuk menggantinya.",
                "error"
            );
            return;
        }

        selectedPosters.push(number);
        clearMessage();
    }

    updatePosterDisplay();
    updateVotingStatus();
}

function updatePosterDisplay() {
    document.querySelectorAll(".poster-select").forEach(button => {
        const number = Number(button.dataset.poster);
        const index = selectedPosters.indexOf(number);
        const selected = index !== -1;

        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", String(selected));
        button.querySelector(".selection-number").textContent =
            selected ? String(index + 1) : "";
    });
}

/*
 * SUBMIT VIA FORM POST.
 * Browser tidak dapat memastikan hasil penyimpanan dari iframe lintas domain.
 */
submitButton.addEventListener("click", submitVote);

function submitVote() {
    // Jika sudah voting, jangan kirim data lagi.
    if (hasVoted) {
        showMessage(
            "Suara Anda sudah tercatat, terima kasih atas partisipasi Anda.",
            "success"
        );
        return;
    }

    if (isSubmitting) return;

    const name = nameInput.value.trim();

    if (!name) {
        showMessage(
            "Silakan tuliskan nama Anda terlebih dahulu.",
            "error"
        );
        nameInput.focus();
        return;
    }

    if (selectedPosters.length !== 3) {
        showMessage(
            "Silakan pilih tepat 3 poster.",
            "error"
        );
        return;
    }

    if (!GOOGLE_SCRIPT_URL.endsWith("/exec")) {
        showMessage(
            "URL Google Apps Script tidak valid.",
            "error"
        );
        return;
    }

    const voteData = {
        name: name,
        pilihan1: selectedPosters[0],
        pilihan2: selectedPosters[1],
        pilihan3: selectedPosters[2]
    };

    const form = document.createElement("form");
    form.method = "POST";
    form.action = GOOGLE_SCRIPT_URL;
    form.target = "votingTarget";
    form.acceptCharset = "UTF-8";
    form.style.display = "none";

    Object.entries(voteData).forEach(([key, value]) => {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = key;
        input.value = String(value);
        form.appendChild(input);
    });

    isSubmitting = true;
    submitButton.textContent = "MENGIRIM...";
    updateVotingStatus();

    showMessage("Mengirim permintaan voting...", "");

    document.body.appendChild(form);

    try {
        form.submit();

        /*
         * Status disimpan pada browser setelah perintah pengiriman dijalankan.
         * Ini bukan konfirmasi bahwa data berhasil tersimpan di Google Sheets.
         */
        localStorage.setItem(VOTING_STORAGE_KEY, "true");
        hasVoted = true;

        updateVotingStatus();

        showMessage(
            "Terima kasih sudah berpartisipasi dalam Psychological Scale Exhibition!",
            "success"
        );
    } catch (error) {
        console.error("Gagal mengirim form:", error);

        showMessage(
            "Form gagal dikirim. Silakan coba lagi.",
            "error"
        );

        isSubmitting = false;
        updateVotingStatus();
        form.remove();
        return;
    }

    /*
     * Bersihkan elemen form sementara.
     * Status voting tetap tersimpan dan tombol tidak kembali menjadi KIRIM.
     */
    window.setTimeout(() => {
        form.remove();
        isSubmitting = false;
        updateVotingStatus();
    }, 5000);
}

/* Inisialisasi */
updatePosterDisplay();
updateVotingStatus();

if (hasVoted) {
    showMessage(
        "Anda sudah melakukan voting melalui browser ini. Terima kasih!",
        "success"
