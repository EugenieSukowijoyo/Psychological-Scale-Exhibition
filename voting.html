<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voting | Psychological Scale Exhibition</title>

<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --blue: #1464c4;
    --blue-deep: #075487;
    --light-blue: #b9d3ef;
    --very-light-blue: #eef6fc;
    --white: #fff;
    --black: #111;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    width: 100%;
    min-height: 100vh;
    font-family: 'Montserrat', Arial, sans-serif;
    color: var(--black);
    background:
        linear-gradient(rgba(244,249,253,.4), rgba(244,249,253,.4)),
        url("assets/background.png") center / cover fixed no-repeat;
    overflow-x: hidden;
}

button, input {
    font: inherit;
}

/* ==================================================
   HAMBURGER BUTTON — MASTER REFERENCE INDEX.HTML
================================================== */

.menu-button {
    position: fixed;
    top: 38px;
    left: 30px;
    width: 64px;
    height: 48px;
    padding: 4px 0;
    border: none;
    background: transparent;
    cursor: pointer;
    z-index: 1200;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .3s ease;
}

/* FULL-WIDTH PROTECTED AREA */
.menu-button::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 105px;
    background: #eef6fc;
    opacity: 0;
    visibility: hidden;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: -1;
    pointer-events: none;
    transition:
        opacity .25s ease,
        visibility .25s ease;
}

/* GRADIENT DI BAWAH PROTECTED AREA */
.menu-button::after {
    content: "";
    position: fixed;
    top: 105px;
    left: 0;
    width: 100vw;
    height: 35px;
    background: linear-gradient(
        to bottom,
        #eef6fc,
        rgba(238,246,252,0)
    );
    opacity: 0;
    visibility: hidden;
    z-index: -1;
    pointer-events: none;
    transition:
        opacity .25s ease,
        visibility .25s ease;
}

/* AKTIF SAAT KONTEN BERTABRAKAN */
.menu-button.is-obscured::before {
    opacity: .97;
    visibility: visible;
}

.menu-button.is-obscured::after {
    opacity: .95;
    visibility: visible;
}

/* PROTECTED AREA HILANG SAAT MENU TERBUKA */
.menu-button.active::before,
.menu-button.active::after {
    opacity: 0;
    visibility: hidden;
}

/* TIGA GARIS HAMBURGER */
.menu-button span {
    display: block;
    width: 64px;
    height: 5px;
    flex-shrink: 0;
    background: var(--blue-deep);
    border-radius: 0;
    transition:
        transform .35s ease,
        opacity .25s ease,
        background .25s ease;
}

/* HAMBURGER MENJADI X */
.menu-button.active span:nth-child(1) {
    transform: translateY(17px) rotate(45deg);
    background: var(--white);
}

.menu-button.active span:nth-child(2) {
    opacity: 0;
}

.menu-button.active span:nth-child(3) {
    transform: translateY(-17px) rotate(-45deg);
    background: var(--white);
}

.menu-button:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 6px;
}

/* ==================================================
   OVERLAY
================================================== */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 38, 66, .35);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition:
        opacity .4s ease,
        visibility .4s ease;
    z-index: 900;
}

.overlay.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

/* ==================================================
   SIDE MENU
================================================== */

.side-menu {
    position: fixed;
    top: 0;
    left: 0;
    width: 365px;
    max-width: 40vw;
    height: 100vh;
    height: 100dvh;
    background: var(--blue-deep);
    color: var(--white);
    z-index: 1000;
    transform: translateX(-100%);
    transition: transform .4s ease;
    display: flex;
    justify-content: flex-start;
    align-items: stretch;
    box-shadow: 8px 0 28px rgba(0, 0, 0, .10);
    overflow: hidden;
}

.side-menu.active {
    transform: translateX(0);
}

/* PROTECTED AREA SIDE MENU */
.side-menu::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 125px;
    background: rgba(7, 84, 135, .96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 18px rgba(0, 0, 0, .08);
    z-index: 2;
    pointer-events: none;
}

/* GRADIENT BLUR SIDE MENU */
.side-menu::after {
    content: "";
    position: absolute;
    top: 100px;
    left: 0;
    right: 0;
    height: 45px;
    background: linear-gradient(
        to bottom,
        rgba(7,84,135,.95),
        rgba(7,84,135,0)
    );
    z-index: 2;
    pointer-events: none;
}

/* SIDE MENU CONTENT */
.side-menu-inner {
    position: relative;
    z-index: 1;
    width: 78%;
    height: 100%;
    max-height: 100vh;
    overflow-y: auto;
    padding: 135px 0 50px;
    margin-left: 43px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.35) transparent;
}

.side-menu-inner::-webkit-scrollbar {
    width: 5px;
}

.side-menu-inner::-webkit-scrollbar-track {
    background: transparent;
}

.side-menu-inner::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.35);
    border-radius: 10px;
}

.side-menu-inner::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,.55);
}

/* SECTION TITLE */
.menu-label,
.menu-section-title {
    color: rgba(255,255,255,.55);
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-top: 20px;
    margin-bottom: -5px;
    flex-shrink: 0;
}

/* NAVIGATION LINKS */
.menu-link {
    display: block;
    flex-shrink: 0;
    width: 100%;
    padding: 13px 0;
    border-bottom: 1px solid rgba(255,255,255,.25);
    color: var(--white);
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    line-height: 1.4;
    transition:
        padding-left .3s ease,
        opacity .3s ease;
}

.menu-link:hover {
    padding-left: 10px;
    opacity: .75;
}

.menu-link:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 3px;
}

/* ==================================================
   VOTING PAGE
================================================== */

.voting-page {
    width: 100%;
    min-height: 100vh;
    padding: 55px 6% 80px;
}

.header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 30px;
}

.exhibition-title {
    margin-bottom: 10px;
    font-size: clamp(14px, 1.5vw, 20px);
    font-weight: 500;
}

.header h1 {
    max-width: 1000px;
    font-family: 'League Spartan', sans-serif;
    font-size: clamp(58px, 7vw, 108px);
    font-weight: 800;
    letter-spacing: -3px;
    line-height: .9;
    color: var(--blue);
    text-transform: uppercase;
}

.name-wrapper {
    width: min(660px, 90%);
    margin: 30px auto 50px;
}

.name-input {
    width: 100%;
    padding: 18px 30px;
    border: 2px solid transparent;
    border-radius: 50px;
    background: rgba(185,211,239,.96);
    color: var(--black);
    font-size: 21px;
    font-weight: 500;
    text-align: center;
    outline: none;
    transition: transform .3s, box-shadow .3s;
}

.name-input::placeholder {
    color: var(--black);
    opacity: 1;
}

.name-input:focus {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(7,84,135,.14);
}

.name-input:focus-visible {
    border-color: var(--blue);
}

.instruction {
    max-width: 800px;
    margin: 0 auto 40px;
    text-align: center;
    font-size: clamp(14px, 1.2vw, 18px);
    line-height: 1.55;
}

.instruction strong {
    font-weight: 800;
}

.poster-grid {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 55px 5%;
    align-items: start;
}

.poster-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-width: 0;
}

.poster-select {
    position: relative;
    width: 100%;
    max-width: 280px;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    transition: transform .3s;
}

.poster-select img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: .75 / 1;
    object-fit: cover;
    box-shadow: 0 8px 20px rgba(0,0,0,.14);
    transition: transform .3s, box-shadow .3s, filter .3s;
}

.poster-select:hover {
    transform: translateY(-7px);
}

.poster-select:hover img {
    transform: scale(1.02);
    box-shadow: 0 18px 35px rgba(0,0,0,.26);
    filter: brightness(1.04);
}

.poster-select.selected img {
    box-shadow: 0 0 0 5px var(--blue), 0 15px 35px rgba(0,0,0,.3);
    filter: brightness(.78);
}

.poster-select:focus-visible {
    outline: 3px solid var(--blue-deep);
    outline-offset: 7px;
}

.selection-number {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 43px;
    height: 43px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--blue);
    color: var(--white);
    font-family: 'League Spartan', sans-serif;
    font-size: 21px;
    font-weight: 800;
    opacity: 0;
    transform: scale(.5);
    transition: opacity .25s, transform .25s;
}

.poster-select.selected .selection-number {
    opacity: 1;
    transform: scale(1);
}

.poster-title {
    margin-top: 20px;
    color: var(--black);
    font-size: clamp(14px, 1.3vw, 20px);
    font-weight: 700;
    letter-spacing: 4px;
    text-decoration: underline;
    text-underline-offset: 6px;
}

.voting-status {
    min-height: 28px;
    margin-top: 35px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
}

.submit-wrapper {
    display: flex;
    justify-content: center;
    margin-top: 30px;
}

.submit-button,
.bottom-back a {
    min-width: 290px;
    padding: 17px 35px;
    border: 3px solid var(--blue-deep);
    border-radius: 50px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 4px;
    text-align: center;
    transition:
        background .3s,
        color .3s,
        transform .3s,
        opacity .3s;
}

.submit-button {
    background: var(--blue-deep);
    color: var(--white);
    cursor: pointer;
}

.submit-button:hover:not(:disabled) {
    background: transparent;
    color: var(--blue-deep);
    transform: translateY(-3px);
}

.submit-button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.submit-button:focus-visible,
.bottom-back a:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 5px;
}

.form-message {
    min-height: 25px;
    margin-top: 22px;
    text-align: center;
    color: var(--blue-deep);
    font-size: 15px;
    font-weight: 600;
    overflow-wrap: anywhere;
}

.form-message.error {
    color: #b42318;
}

.form-message.success {
    color: #167447;
}

.bottom-back {
    display: flex;
    justify-content: center;
    margin-top: 55px;
}

.bottom-back a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--blue-deep);
    text-decoration: none;
}

.bottom-back a:hover {
    background: var(--blue-deep);
    color: var(--white);
    transform: translateY(-3px);
}

/* ==================================================
   TABLET
================================================== */

@media (max-width: 1100px) {
    .poster-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 45px 5%;
    }

    .header h1 {
        font-size: clamp(60px, 9vw, 115px);
    }
}

/* ==================================================
   MOBILE / TABLET
================================================== */

@media (max-width: 700px) {
    /* HAMBURGER MOBILE */
    .menu-button {
        top: 28px;
        left: 22px;
        width: 52px;
        height: 40px;
        padding: 4px 0;
    }

    .menu-button::before {
        top: 0;
        left: 0;
        width: 100vw;
        height: 82px;
        background: #eef6fc;
    }

    .menu-button::after {
        top: 82px;
        left: 0;
        width: 100vw;
        height: 30px;
        background: linear-gradient(
            to bottom,
            #eef6fc,
            rgba(238,246,252,0)
        );
    }

    .menu-button span {
        width: 52px;
        height: 4px;
    }

    .menu-button.active span:nth-child(1) {
        transform: translateY(13px) rotate(45deg);
    }

    .menu-button.active span:nth-child(3) {
        transform: translateY(-13px) rotate(-45deg);
    }

    .menu-button.active::before,
    .menu-button.active::after {
        opacity: 0;
        visibility: hidden;
    }

    /* SIDE MENU MOBILE */
    .side-menu {
        width: 310px;
        max-width: 82vw;
    }

    .side-menu::before {
        height: 110px;
    }

    .side-menu::after {
        top: 88px;
        height: 40px;
    }

    .side-menu-inner {
        width: 78%;
        padding: 120px 0 40px;
        margin-left: 38px;
        gap: 18px;
    }

    .menu-link {
        font-size: 17px;
    }

    /* VOTING MOBILE */
    .voting-page {
        padding: 115px 25px 70px;
    }

    .header {
        margin-bottom: 25px;
    }

    .exhibition-title {
        font-size: 12px;
    }

    .header h1 {
        font-size: 54px;
        letter-spacing: -2px;
    }

    .name-wrapper {
        width: 100%;
        margin: 25px auto 40px;
    }

    .name-input {
        padding: 16px 20px;
        font-size: 17px;
    }

    .instruction {
        margin-bottom: 30px;
        font-size: 13px;
    }

    .poster-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 40px 8%;
    }

    .poster-select {
        max-width: 230px;
    }

    .poster-title {
        font-size: 12px;
        letter-spacing: 2px;
    }

    .selection-number {
        width: 35px;
        height: 35px;
        top: 8px;
        right: 8px;
        font-size: 17px;
    }

    .submit-button,
    .bottom-back a {
        min-width: 240px;
        padding: 15px 25px;
        font-size: 16px;
    }
}

/* ==================================================
   SMALL MOBILE
================================================== */

@media (max-width: 400px) {
    .menu-button {
        top: 23px;
        left: 18px;
        width: 44px;
        height: 34px;
    }

    .menu-button span {
        width: 44px;
        height: 4px;
    }

    .menu-button.active span:nth-child(1) {
        transform: translateY(11px) rotate(45deg);
    }

    .menu-button.active span:nth-child(3) {
        transform: translateY(-11px) rotate(-45deg);
    }

    .side-menu-inner {
        padding-top: 110px;
        padding-bottom: 35px;
        margin-left: 30px;
    }

    .menu-link {
        font-size: 16px;
    }

    .menu-label,
    .menu-section-title {
        font-size: 11px;
    }
}

/* ==================================================
   MOBILE LANDSCAPE
================================================== */

@media (max-width: 768px) and (orientation: landscape) {
    .side-menu-inner {
        padding-top: 100px;
        padding-bottom: 20px;
        gap: 6px;
    }

    .menu-link {
        padding: 8px 0;
        font-size: 15px;
    }

    .menu-label,
    .menu-section-title {
        margin-top: 10px;
    }
}

/* ==================================================
   SMALL POSTER LAYOUT
================================================== */

@media (max-width: 450px) {
    .voting-page {
        padding-left: 20px;
        padding-right: 20px;
    }

    .header h1 {
        font-size: 48px;
    }

    .poster-grid {
        grid-template-columns: 1fr;
        gap: 50px;
    }

    .poster-select {
        max-width: 280px;
    }

    .poster-title {
        font-size: 14px;
    }
}

/* ==================================================
   REDUCED MOTION
================================================== */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<!-- HAMBURGER BUTTON -->

>

</button>

<!-- SIDE MENU -->

<!-- VOTING PAGE -->
<main class="voting-page">
    <header class="header">
        <div class="exhibition-title">Psychological Scale Exhibition</div>
        <h1>PICK YOUR<br>FAVOURITE</h1>
    </header>

    <div class="name-wrapper">
        <input
            type="text"
            id="voterName"
            class="name-input"
            placeholder="Tuliskan nama Anda"
            autocomplete="name"
            maxlength="100"
            aria-label="Nama pemilih"
        >
    </div>

    <p class="instruction">
        Pilih <strong>3 poster</strong> yang ingin Anda pilih.

<!-- Iframe tersembunyi untuk mengirim POST tanpa fetch/CORS -->
<iframe
    name="votingTarget"
    id="votingTarget"
    title="Pengiriman voting"
    style="display:none"
></iframe>

<script>
"use strict";

/*
 * GUNAKAN URL DEPLOYMENT WEB APP AKTIF.
 * Jika membuat deployment baru, periksa URL-nya kembali.
 */
const GOOGLE_SCRIPT_URL =
    "https://script.google.com/a/macros/student.ubaya.ac.id/s/AKfycbxIEltL6DfkOV2ryc4gNzRkCXf9lSmeIsfP4CrPWEbCL-7ORWS2gPRSRqHkIV8dRJ3X/exec";

/* ================= PENGATURAN MODE VOTING =================
   TESTING_MODE = true:
   - Status localStorage dihapus pada browser yang membuka halaman ini.
   - SEND_TEST_VOTES_TO_SHEETS = false: simulasi, tidak masuk Google Sheets.
   - SEND_TEST_VOTES_TO_SHEETS = true: tes dikirim ke Google Sheets.

   TESTING_MODE = false:
   - Mode resmi, voting dibatasi satu kali per browser menggunakan localStorage.
   =========================================================== */

const TESTING_MODE = true;
const SEND_TEST_VOTES_TO_SHEETS = true;
const VOTING_STORAGE_KEY = "pse_voting_submitted_v1";

/* Reset kunci voting lokal setiap kali halaman dibuka dalam testing mode. */
if (TESTING_MODE) {
    localStorage.removeItem(VOTING_STORAGE_KEY);
}

let hasVoted = !TESTING_MODE &&
    localStorage.getItem(VOTING_STORAGE_KEY) === "true";

const posterGrid = document.getElementById("posterGrid");
const nameInput = document.getElementById("voterName");
const submitButton = document.getElementById("submitButton");
const votingStatus = document.getElementById("votingStatus");
const formMessage = document.getElementById("formMessage");
const menuButton = document.getElementById("menuButton");
const sideMenu = document.getElementById("sideMenu");
const overlay = document.getElementById("overlay");

let selectedPosters = [];
let isSubmitting = false;

/* ==================================================
   BUAT 12 POSTER
================================================== */

for (let number = 1; number <= 12; number++) {
    const item = document.createElement("div");
    item.className = "poster-item";

    const button = document.createElement("button");
    button.className = "poster-select";
    button.type = "button";
    button.dataset.poster = String(number);
    button.setAttribute("aria-pressed", "false");

    const img = document.createElement("img");
    img.src = `poster/${number}.jpg`;
    img.alt = `Poster ${number}`;
    img.loading = number > 4 ? "lazy" : "eager";

    const badge = document.createElement("span");
    badge.className = "selection-number";

    button.append(img, badge);
    button.addEventListener("click", () => selectPoster(button));

    const title = document.createElement("div");
    title.className = "poster-title";
    title.textContent = "LOREM IPSUM";

    item.append(button, title);
    posterGrid.appendChild(item);
}

/* ==================================================
   HAMBURGER MENU
================================================== */

function openMenu() {
    menuButton.classList.add("active");
    menuButton.classList.remove("is-obscured");

    sideMenu.classList.add("active");
    overlay.classList.add("active");

    sideMenu.setAttribute("aria-hidden", "false");
    sideMenu.removeAttribute("inert");

    overlay.setAttribute("aria-hidden", "false");

    menuButton.setAttribute("aria-expanded", "true");
    menuButton.setAttribute("aria-label", "Tutup menu");

    document.body.classList.add("menu-open");

    const firstLink = sideMenu.querySelector("a");

    if (firstLink) {
        firstLink.focus({ preventScroll: true });
    }
}

function closeMenu(restoreFocus = false) {
    menuButton.classList.remove("active");
    sideMenu.classList.remove("active");
    overlay.classList.remove("active");

    sideMenu.setAttribute("aria-hidden", "true");
    sideMenu.setAttribute("inert", "");

    overlay.setAttribute("aria-hidden", "true");

    menuButton.setAttribute("aria-expanded", "false");
    menuButton.setAttribute("aria-label", "Buka menu");

    document.body.classList.remove("menu-open");

    if (restoreFocus) {
        menuButton.focus({ preventScroll: true });
    }

    window.setTimeout(checkTopContentCollision, 50);
}

/* TOGGLE HAMBURGER */
menuButton.addEventListener("click", () => {
    if (sideMenu.classList.contains("active")) {
        closeMenu(true);
    } else {
        openMenu();
    }
});

/* TUTUP MENU MELALUI OVERLAY */
overlay.addEventListener("click", () => {
    closeMenu(true);
});

/* TUTUP MENU SETELAH MEMILIH TAUTAN */
sideMenu.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", () => {
        closeMenu(false);
    });
});

/* ==================================================
   DETEKSI PROTECTED AREA
================================================== */

function checkTopContentCollision() {
    if (sideMenu.classList.contains("active")) {
        menuButton.classList.remove("is-obscured");
        return;
    }

    const pageIsScrolled =
        window.scrollY > 5 ||
        document.documentElement.scrollTop > 5;

    if (!pageIsScrolled) {
        menuButton.classList.remove("is-obscured");
        return;
    }

    const protectedBottom =
        window.innerWidth <= 700 ? 82 : 105;

    const elements = document.querySelectorAll(
        ".header, .name-wrapper, .instruction, .poster-item, " +
        ".voting-status, .submit-wrapper, .form-message, .bottom-back"
    );

    let collision = false;

    elements.forEach(element => {
        const rect = element.getBoundingClientRect();

        if (
            rect.top < protectedBottom &&
            rect.bottom > 0
        ) {
            collision = true;
        }
    });

    menuButton.classList.toggle("is-obscured", collision);
}

window.addEventListener(
    "scroll",
    checkTopContentCollision,
    { passive: true }
);

window.addEventListener("resize", checkTopContentCollision);

/* TUTUP MENU DENGAN ESCAPE */
document.addEventListener("keydown", event => {
    if (event.key === "Escape" &&
        sideMenu.classList.contains("active")) {
        closeMenu(true);
    }
});

/* ==================================================
   STATUS DAN PESAN VOTING
================================================== */

function showMessage(message, type = "") {
    formMessage.textContent = message;
    formMessage.className = "form-message";

    if (type) {
        formMessage.classList.add(type);
    }
}

function clearMessage() {
    formMessage.textContent = "";
    formMessage.className = "form-message";
}

function updateVotingStatus() {
    if (hasVoted && !TESTING_MODE) {
        votingStatus.textContent = "Anda sudah memberikan suara.";
        submitButton.disabled = true;
        return;
    }

    votingStatus.textContent =
        `${selectedPosters.length} / 3 poster dipilih`;

    submitButton.disabled =
        isSubmitting || selectedPosters.length !== 3;
}

/* ==================================================
   PILIH TEPAT 3 POSTER
================================================== */

function selectPoster(button) {
    if (isSubmitting || (hasVoted && !TESTING_MODE)) {
        return;
    }

    const number = Number(button.dataset.poster);
    const index = selectedPosters.indexOf(number);

    if (index !== -1) {
        selectedPosters.splice(index, 1);
        clearMessage();
    } else {
        if (selectedPosters.length >= 3) {
            showMessage(
                "Anda sudah memilih 3 poster. Batalkan salah satu pilihan untuk menggantinya.",
                "error"
            );
            return;
        }

        selectedPosters.push(number);
        clearMessage();
    }

    updatePosterDisplay();
    updateVotingStatus();
}

function updatePosterDisplay() {
    document.querySelectorAll(".poster-select").forEach(button => {
        const number = Number(button.dataset.poster);
        const index = selectedPosters.indexOf(number);
        const selected = index !== -1;

        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", String(selected));

        button.querySelector(".selection-number").textContent =
            selected ? String(index + 1) : "";
    });
}

/* ==================================================
   SUBMIT VIA FORM POST
   Browser tidak dapat memastikan hasil penyimpanan
   dari iframe lintas domain.
================================================== */

submitButton.addEventListener("click", submitVote);

function submitVote() {
    if (isSubmitting) {
        return;
    }

    if (hasVoted && !TESTING_MODE) {
        showMessage("Anda sudah memberikan suara.", "error");
        updateVotingStatus();
        return;
    }

    const name = nameInput.value.trim();

    if (!name) {
        showMessage("Silakan tuliskan nama Anda terlebih dahulu.", "error");
        nameInput.focus();
        return;
    }

    if (selectedPosters.length !== 3) {
        showMessage("Silakan pilih tepat 3 poster.", "error");
        return;
    }

    if (!GOOGLE_SCRIPT_URL.endsWith("/exec")) {
        showMessage("URL Google Apps Script tidak valid.", "error");
        return;
    }

    const voteData = {
        name: name,
        pilihan1: selectedPosters[0],
        pilihan2: selectedPosters[1],
        pilihan3: selectedPosters[2]
    };

    /* Dalam testing, pilihan default hanya simulasi
       dan tidak dikirim ke Sheets. */
    if (TESTING_MODE && !SEND_TEST_VOTES_TO_SHEETS) {
        isSubmitting = true;
        submitButton.textContent = "MODE TESTING...";
        updateVotingStatus();

        showMessage(
            `SIMULASI BERHASIL — Nama: ${voteData.name}; pilihan: ${voteData.pilihan1}, ${voteData.pilihan2}, ${voteData.pilihan3}. Data tidak dikirim ke Google Sheets.`,
            ""
        );

        window.setTimeout(() => {
            isSubmitting = false;
            submitButton.textContent = "KIRIM";
            updateVotingStatus();
        }, 1800);

        return;
    }

    const form = document.createElement("form");
    form.method = "POST";
    form.action = GOOGLE_SCRIPT_URL;
    form.target = "votingTarget";
    form.acceptCharset = "UTF-8";
    form.style.display = "none";

    Object.entries(voteData).forEach(([key, value]) => {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = key;
        input.value = String(value);
        form.appendChild(input);
    });

    isSubmitting = true;
    submitButton.textContent = "MENGIRIM...";
    updateVotingStatus();

    showMessage("Mengirim permintaan voting...", "");

    document.body.appendChild(form);

    try {
        form.submit();

        /*
         * Mode resmi: simpan kunci lokal setelah form.submit()
         * dipanggil.
         * Mode testing yang dikirim ke Sheets tidak mengunci browser.
         * Ini bukan konfirmasi bahwa server benar-benar menyimpan data.
         */
        if (!TESTING_MODE) {
            localStorage.setItem(VOTING_STORAGE_KEY, "true");
            hasVoted = true;
        }

        showMessage(
            TESTING_MODE
                ? "Permintaan tes telah dikirim. Periksa Google Sheets untuk memastikan data masuk."
                : "Suara Anda telah dikirim. Terima kasih telah berpartisipasi dalam Psychological Scale Exhibition.",
            ""
        );
    } catch (error) {
        console.error("Gagal mengirim form:", error);

        showMessage(
            "Form gagal dikirim. Silakan coba lagi.",
            "error"
        );

        isSubmitting = false;
        submitButton.textContent = "KIRIM";
        updateVotingStatus();
        form.remove();
        return;
    }

    /*
     * Tahan tombol agar tidak mudah terkirim berulang.
     * Ini bukan deteksi keberhasilan server.
     */
    window.setTimeout(() => {
        form.remove();
        isSubmitting = false;
        submitButton.textContent = "KIRIM";
        updateVotingStatus();
    }, 5000);
}

/* ==================================================
   INISIALISASI
================================================== */

updatePosterDisplay();
updateVotingStatus();
checkTopContentCollision();
</script>

</body>
</html>
