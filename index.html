<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Psychological Scale Exhibition</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {
            width: 100%;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            overflow: hidden;
        }


        /* =====================================================
           HERO / MAIN PAGE
        ===================================================== */

        .hero {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            position: relative;

            background-image: url("assets/background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: white;

            padding-top: 8vh;

            transition: filter 0.4s ease;
        }


        /* =====================================================
           SUBTITLE
        ===================================================== */

        .subtitle {
            font-size: clamp(16px, 1.8vw, 28px);

            font-weight: 400;

            letter-spacing: 0.5px;

            text-align: center;

            margin-bottom: 30px;
        }


        /* =====================================================
           MAIN TITLE
        ===================================================== */

        .title {
            font-size: clamp(60px, 8vw, 135px);

            line-height: 0.95;

            font-weight: 800;

            text-align: center;

            letter-spacing: -4px;

            color: white;
        }

        .title span {
            display: block;
        }


        /* =====================================================
           HAMBURGER BUTTON
        ===================================================== */

        .menu-button {
            position: fixed;

            top: 28px;
            left: 30px;

            width: 48px;
            height: 42px;

            padding: 4px 0;

            border: none;

            background: transparent;

            cursor: pointer;

            z-index: 1100;

            display: flex;
            flex-direction: column;

            justify-content: space-between;

            transition: opacity 0.3s ease;
        }


        /* Garis hamburger */

        .menu-button span {
            width: 48px;
            height: 4px;

            background: white;

            border-radius: 2px;

            display: block;

            transition:
                transform 0.35s ease,
                opacity 0.25s ease;
        }


        /* =====================================================
           HAMBURGER → X
        ===================================================== */

        .menu-button.active span:nth-child(1) {
            transform: translateY(15px) rotate(45deg);
        }

        .menu-button.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-button.active span:nth-child(3) {
            transform: translateY(-15px) rotate(-45deg);
        }


        /* =====================================================
           THEME NAVIGATION
        ===================================================== */

        .theme-navigation {
            position: absolute;

            bottom: 27%;

            width: min(60%, 900px);

            display: flex;

            justify-content: space-between;

            align-items: flex-start;
        }


        /* =====================================================
           THEME ITEM
        ===================================================== */

        .theme-item {
            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }


        /* =====================================================
           THEME BUTTON
        ===================================================== */

        .theme-button {
            position: relative;

            color: white;

            text-decoration: none;

            font-size: clamp(18px, 2vw, 30px);

            font-weight: 700;

            letter-spacing: 8px;

            padding: 8px 12px;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }


        /* Garis bawah tema */

        .theme-button::after {
            content: "";

            position: absolute;

            left: 10px;
            right: 10px;

            bottom: 0;

            height: 2px;

            background: white;

            transform: scaleX(1);

            transition:
                transform 0.3s ease,
                height 0.3s ease;
        }


        /* Hover tema */

        .theme-button:hover {
            transform: translateY(-5px);

            opacity: 0.85;
        }

        .theme-button:hover::after {
            transform: scaleX(0.65);

            height: 3px;
        }


        /* =====================================================
           VOTING AREA
        ===================================================== */

        .voting-area {
            position: absolute;

            bottom: 14%;

            left: 50%;

            transform: translateX(-50%);

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* =====================================================
           VOTING BUTTON
        ===================================================== */

        .vote-button {
            display: flex;

            align-items: center;

            justify-content: center;

            min-width: 180px;

            padding: 12px 35px;

            color: white;

            background: rgba(255, 255, 255, 0.10);

            border: 2px solid white;

            border-radius: 30px;

            text-decoration: none;

            font-size: 15px;

            font-weight: 700;

            letter-spacing: 4px;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                transform 0.3s ease;
        }


        /* Hover voting */

        .vote-button:hover {
            background: white;

            color: #07578d;

            transform: translateY(-3px);
        }


        /* =====================================================
           OVERLAY
        ===================================================== */

        .overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.42);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.4s ease,
                visibility 0.4s ease;

            z-index: 900;
        }

        .overlay.active {
            opacity: 1;

            visibility: visible;
        }


        /* =====================================================
           SIDE MENU
        ===================================================== */

        .side-menu {
            position: fixed;

            top: 0;
            left: 0;

            width: 370px;

            max-width: 38vw;

            height: 100vh;

            background: #07578d;

            z-index: 1000;

            transform: translateX(-100%);

            transition: transform 0.4s ease;

            display: flex;

            justify-content: center;

            align-items: center;

            box-shadow:
                8px 0 25px rgba(0, 0, 0, 0.08);
        }


        /* Menu terbuka */

        .side-menu.active {
            transform: translateX(0);
        }


        /* =====================================================
           SIDE MENU CONTENT
        ===================================================== */

        .side-menu-content {
            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 58px;

            padding: 0 30px;
        }


        /* =====================================================
           SIDE MENU LINK
        ===================================================== */

        .side-menu a {
            position: relative;

            display: inline-block;

            color: white;

            text-decoration: none;

            font-size: clamp(16px, 1.7vw, 25px);

            font-weight: 700;

            letter-spacing: 6px;

            text-align: center;

            padding: 0 5px 8px;

            white-space: nowrap;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        /* Garis bawah menu */

        .side-menu a::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;

            bottom: 0;

            height: 2px;

            background: white;

            transition: transform 0.3s ease;
        }


        /* Hover menu */

        .side-menu a:hover {
            opacity: 0.75;

            transform: translateY(-3px);
        }

        .side-menu a:hover::after {
            transform: scaleX(0.7);
        }


        /* =====================================================
           SAAT MENU TERBUKA
        ===================================================== */

        body.menu-open .hero {
            filter: brightness(0.62);
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            .hero {
                padding-top: 10vh;
            }

            .title {
                letter-spacing: -2px;
            }

            .theme-navigation {
                width: 75%;

                bottom: 28%;
            }

            .side-menu {
                width: 360px;

                max-width: 50vw;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                overflow: auto;
            }


            /* Hero */

            .hero {
                min-height: 100vh;

                height: auto;

                padding:
                    10vh
                    20px
                    18vh;
            }


            /* Hamburger */

            .menu-button {
                top: 20px;

                left: 20px;

                width: 42px;

                height: 38px;
            }

            .menu-button span {
                width: 42px;

                height: 4px;
            }

            .menu-button.active span:nth-child(1) {
                transform: translateY(13px) rotate(45deg);
            }

            .menu-button.active span:nth-child(3) {
                transform: translateY(-13px) rotate(-45deg);
            }


            /* Subtitle */

            .subtitle {
                font-size: 14px;

                margin-bottom: 35px;
            }


            /* Title */

            .title {
                font-size: clamp(45px, 14vw, 75px);

                letter-spacing: -2px;

                line-height: 0.95;
            }


            /* Theme */

            .theme-navigation {
                position: static;

                width: 100%;

                margin-top: 80px;

                display: flex;

                flex-direction: row;

                justify-content: space-around;

                align-items: flex-start;
            }

            .theme-button {
                font-size: 15px;

                letter-spacing: 4px;
            }


            /* Voting */

            .voting-area {
                position: static;

                transform: none;

                margin-top: 70px;
            }

            .vote-button {
                min-width: 160px;

                padding: 11px 25px;

                font-size: 13px;

                letter-spacing: 3px;
            }


            /* Sidebar */

            .side-menu {
                width: 78vw;

                max-width: none;
            }

            .side-menu-content {
                gap: 50px;

                padding: 0 20px;
            }

            .side-menu a {
                font-size: 15px;

                letter-spacing: 5px;
            }
        }

        /* =====================================================
        INTRO VIDEO POPUP
        ===================================================== */

        .video-popup {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.72);

            z-index: 2000;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.4s ease,
                visibility 0.4s ease;
        }


        /* Popup aktif */

        .video-popup.active {
            opacity: 1;

            visibility: visible;
        }


        /* =====================================================
        VIDEO WRAPPER
        ===================================================== */

        .video-popup-content {
            position: relative;

            height: min(82vh, 800px);

            aspect-ratio: 9 / 16;

            background: #000;

            overflow: visible;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);

            transform: scale(0.92);

            transition:
                transform 0.4s ease;
        }


        /* Animasi saat popup muncul */

        .video-popup.active .video-popup-content {
            transform: scale(1);
        }


        /* =====================================================
        VIDEO
        ===================================================== */

        .video-popup-content video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            background: #000;
        }


        /* =====================================================
        CLOSE BUTTON
        ===================================================== */

        .video-close {
            position: absolute;

            top: -18px;
            right: -18px;

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 50%;

            background: white;

            color: #07578d;

            font-size: 28px;

            font-weight: 300;

            line-height: 1;

            cursor: pointer;

            z-index: 10;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 0;

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                color 0.3s ease;
        }


        /* Hover X */

        .video-close:hover {

            transform:
                rotate(90deg)
                scale(1.08);

            background: #07578d;

            color: white;
        }


        /* =====================================================
        MOBILE POPUP
        ===================================================== */

        @media (max-width: 600px) {

            .video-popup-content {

                width: 82vw;

                height: auto;

                aspect-ratio: 9 / 16;
            }


            .video-close {

                width: 38px;
                height: 38px;

                top: -15px;
                right: -15px;

                font-size: 25px;
            }

        }

    </style>

</head>


<body>

    <!-- =====================================================
        INTRO VIDEO POPUP
    ====================================================== -->

    <div
        class="video-popup"
        id="videoPopup"
    >


        <!-- =================================================
            VIDEO CONTENT
        ================================================== -->

        <div
            class="video-popup-content"
            id="videoPopupContent"
        >


            <!-- =================================================
                CLOSE BUTTON
            ================================================== -->

            <button
                class="video-close"
                id="videoClose"
                aria-label="Tutup video"
            >
                ×
            </button>


            <!-- =================================================
                VIDEO
            ================================================== -->

            <video
                id="introVideo"
                controls
                playsinline
                preload="auto"
            >

                <source
                    src="assets/tentang.mp4"
                    type="video/mp4"
                >

                Browser Anda tidak mendukung
                pemutaran video.

            </video>


        </div>

    </div>

    <!-- =====================================================
         HAMBURGER BUTTON
    ====================================================== -->

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Buka menu"
        aria-expanded="false"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>


    <!-- =====================================================
         SIDE MENU
    ====================================================== -->

    <aside
        class="side-menu"
        id="sideMenu"
    >

        <nav class="side-menu-content">

            <a href="tentang.html">
                TENTANG
            </a>

            <a href="profil-dosen.html">
                PROFIL DOSEN
            </a>

            <a href="profil-asisten.html">
                PROFIL ASISTEN
            </a>

        </nav>

    </aside>


    <!-- =====================================================
         OVERLAY
    ====================================================== -->

    <div
        class="overlay"
        id="overlay"
    ></div>


    <!-- =====================================================
         MAIN PAGE
    ====================================================== -->

    <main class="hero">


        <!-- =================================================
             SUBTITLE
        ================================================== -->

        <p class="subtitle">
            PENYUSUNAN SKALA PSIKOLOGIS 26/27
        </p>


        <!-- =================================================
             TITLE
        ================================================== -->

        <h1 class="title">

            Psychological Scale

            <span>
                Exhibition
            </span>

        </h1>


        <!-- =================================================
             THEME NAVIGATION
        ================================================== -->

        <nav class="theme-navigation">


            <!-- TEMA 1 -->

            <div class="theme-item">

                <a
                    href="tema1.html"
                    class="theme-button"
                >
                    TEMA 1
                </a>

            </div>


            <!-- TEMA 2 -->

            <div class="theme-item">

                <a
                    href="tema2.html"
                    class="theme-button"
                >
                    TEMA 2
                </a>

            </div>


            <!-- TEMA 3 -->

            <div class="theme-item">

                <a
                    href="tema3.html"
                    class="theme-button"
                >
                    TEMA 3
                </a>

            </div>


        </nav>


        <!-- =================================================
             SINGLE VOTING BUTTON
        ================================================== -->

        <div class="voting-area">

            <a
                href="voting.html"
                class="vote-button"
            >
                VOTE
            </a>

        </div>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
        INTRO VIDEO POPUP
        ===================================================== */

        const videoPopup =
            document.getElementById("videoPopup");

        const videoClose =
            document.getElementById("videoClose");

        const introVideo =
            document.getElementById("introVideo");

        const videoPopupContent =
            document.getElementById("videoPopupContent");


        /* =====================================================
        CHECK FIRST VISIT
        ===================================================== */

        const hasSeenIntro =
            localStorage.getItem(
                "psychologicalScaleIntroSeen"
            );


        /* =====================================================
        SHOW POPUP
        ===================================================== */

        function showVideoPopup() {

            videoPopup.classList.add("active");

            document.body.style.overflow = "hidden";

        }


        /* =====================================================
        CLOSE POPUP
        ===================================================== */

        function closeVideoPopup() {

            videoPopup.classList.remove("active");

            document.body.style.overflow = "";

            /*
            Hentikan video ketika popup ditutup
            */

            introVideo.pause();

            /*
            Simpan bahwa pengunjung
            sudah melihat popup
            */

            localStorage.setItem(
                "psychologicalScaleIntroSeen",
                "true"
            );

        }


        /* =====================================================
        FIRST VISIT
        ===================================================== */

        if (!hasSeenIntro) {

            window.addEventListener(
                "load",
                function () {

                    setTimeout(
                        showVideoPopup,
                        300
                    );

                }
            );

        }


        /* =====================================================
        CLOSE BUTTON
        ===================================================== */

        videoClose.addEventListener(
            "click",
            closeVideoPopup
        );


        /* =====================================================
        CLICK OUTSIDE VIDEO
        ===================================================== */

        videoPopup.addEventListener(
            "click",
            function (event) {

                if (
                    event.target === videoPopup
                ) {

                    closeVideoPopup();

                }

            }
        );


        /* =====================================================
        ESCAPE KEY
        ===================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape" &&
                    videoPopup.classList.contains("active")
                ) {

                    closeVideoPopup();

                }

            }
        );

        /* =================================================
           ELEMENT
        ================================================== */

        const menuButton =
            document.getElementById("menuButton");

        const sideMenu =
            document.getElementById("sideMenu");

        const overlay =
            document.getElementById("overlay");


        /* =================================================
           OPEN MENU
        ================================================== */

        function openMenu() {

            sideMenu.classList.add("active");

            overlay.classList.add("active");

            menuButton.classList.add("active");

            menuButton.setAttribute(
                "aria-expanded",
                "true"
            );

            document.body.classList.add(
                "menu-open"
            );
        }


        /* =================================================
           CLOSE MENU
        ================================================== */

        function closeMenu() {

            sideMenu.classList.remove("active");

            overlay.classList.remove("active");

            menuButton.classList.remove("active");

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

            document.body.classList.remove(
                "menu-open"
            );
        }


        /* =================================================
           TOGGLE MENU
        ================================================== */

        menuButton.addEventListener(
            "click",
            function () {

                if (
                    sideMenu.classList.contains(
                        "active"
                    )
                ) {

                    closeMenu();

                } else {

                    openMenu();

                }

            }
        );


        /* =================================================
           CLICK OUTSIDE
        ================================================== */

        overlay.addEventListener(
            "click",
            closeMenu
        );


        /* =================================================
           ESCAPE KEY
        ================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Escape") {

                    closeMenu();

                }

            }
        );


        /* =================================================
           CLOSE AFTER MENU LINK CLICK
        ================================================== */

        document
            .querySelectorAll(".side-menu a")
            .forEach(function (link) {

                link.addEventListener(
                    "click",
                    closeMenu
                );

            });

    </script>


</body>

</html>
