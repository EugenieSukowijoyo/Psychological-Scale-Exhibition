<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Theme | Psychological Scale Exhibition</title>

    <!-- GOOGLE FONTS -->
    <link
        href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&family=Oswald:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =====================================================
           RESET & VARIABLES
        ===================================================== */

        :root {
            --blue: #1464c4;
            --blue-deep: #075487;
            --ink: #111111;
            --white: #ffffff;
            --light-bg: #eef6fc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;

            font-family: 'Montserrat', sans-serif;
            color: var(--ink);

            background-color: var(--light-bg);
            background-image: url("assets/background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            overflow-x: hidden;
        }

        button,
        a {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =====================================================
           TOP GRADIENT PROTECTION
        ===================================================== */

        .top-scroll-protection {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 115px;

            background: linear-gradient(
                to bottom,
                rgba(238, 246, 252, 1) 0%,
                rgba(238, 246, 252, 1) 42%,
                rgba(238, 246, 252, 0.96) 52%,
                rgba(238, 246, 252, 0.78) 65%,
                rgba(238, 246, 252, 0.45) 80%,
                rgba(238, 246, 252, 0.18) 91%,
                rgba(238, 246, 252, 0) 100%
            );

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            z-index: 1100;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .top-scroll-protection.active {
            opacity: 1;
            visibility: visible;
        }

        body.menu-open .top-scroll-protection {
            opacity: 0;
            visibility: hidden;
        }

        /* =====================================================
           HAMBURGER MENU
           DISESUAIKAN DENGAN HALAMAN UTAMA
        ===================================================== */

        .menu-button {
            position: fixed;
            top: 38px;
            left: 30px;

            width: 64px;
            height: 48px;
            padding: 4px 0;

            border: none;
            border-radius: 0;
            background: transparent;

            cursor: pointer;
            z-index: 1200;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;

            -webkit-tap-highlight-color: transparent;
        }

        .menu-button span {
            display: block;

            width: 64px;
            height: 5px;

            flex-shrink: 0;

            background: var(--blue-deep);
            border-radius: 0;

            transition:
                transform 0.35s ease,
                opacity 0.25s ease,
                background 0.25s ease;
        }

        /* Animasi hamburger menjadi X */

        .menu-button.active span:nth-child(1) {
            transform: translateY(17px) rotate(45deg);
            background: var(--white);
        }

        .menu-button.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-button.active span:nth-child(3) {
            transform: translateY(-17px) rotate(-45deg);
            background: var(--white);
        }

        .menu-button:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 7px;
        }

        /* =====================================================
           OVERLAY
        ===================================================== */

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 38, 66, 0.35);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.4s ease,
                visibility 0.4s ease;

            z-index: 900;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* =====================================================
           SIDE MENU
           STRUKTUR SAMA DENGAN HALAMAN LAIN
        ===================================================== */

        .side-menu {
            position: fixed;
            top: 0;
            left: 0;

            width: 365px;
            max-width: 40vw;

            height: 100vh;
            height: 100dvh;

            background: var(--blue-deep);

            z-index: 1000;

            transform: translateX(-100%);
            transition: transform 0.4s ease;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            box-shadow: 8px 0 28px rgba(0, 0, 0, 0.10);
        }

        .side-menu.active {
            transform: translateX(0);
        }

        /* Area isi menu dapat di-scroll secara mandiri */

        .side-menu-content {
            width: 78%;
            max-height: 100%;

            overflow-y: auto;
            overflow-x: hidden;

            padding-top: 125px;
            padding-bottom: 50px;

            display: flex;
            flex-direction: column;
            gap: 18px;

            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.35) transparent;
        }

        .side-menu-content::-webkit-scrollbar {
            width: 5px;
        }

        .side-menu-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .side-menu-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.35);
            border-radius: 10px;
        }

        /* Label bagian menu */

        .menu-section-title {
            color: rgba(255, 255, 255, 0.55);

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;

            margin-top: 20px;
            margin-bottom: -5px;
        }

        /* Tautan menu */

        .side-menu-content a {
            display: block;

            color: var(--white);
            text-decoration: none;

            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            line-height: 1.35;

            padding: 13px 0;

            border-bottom: 1px solid rgba(255, 255, 255, 0.25);

            transition:
                padding-left 0.3s ease,
                opacity 0.3s ease,
                color 0.3s ease;
        }

        .side-menu-content a:hover {
            padding-left: 10px;
            opacity: 0.75;
        }

        .side-menu-content a:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        /* Penanda halaman aktif */

        .side-menu-content a.current-page {
            color: #c7e3ff;
            border-bottom-color: rgba(255, 255, 255, 0.65);
        }

        /* =====================================================
           MAIN PAGE
        ===================================================== */

        .theme-page {
            position: relative;

            width: 100%;
            min-height: 100vh;

            padding: 55px 7vw 75px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =====================================================
           PAGE TITLE
        ===================================================== */

        .page-title {
            margin: 0 0 95px;

            color: var(--blue);

            font-family: 'League Spartan', sans-serif;
            font-size: clamp(64px, 7.5vw, 120px);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -3px;

            text-align: center;
            text-transform: uppercase;
        }

        /* =====================================================
           THEME GRID
        ===================================================== */

        .theme-grid {
            width: 100%;
            max-width: 1150px;

            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));

            column-gap: clamp(55px, 14vw, 240px);
            row-gap: 85px;

            align-items: center;
        }

        /* =====================================================
           THEME BUTTON
        ===================================================== */

        .theme-button {
            width: 100%;
            min-width: 0;
            min-height: 72px;

            padding: 12px 24px;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 3px solid var(--black);
            border-radius: 100px;

            background: rgba(255, 255, 255, 0.12);

            color: var(--black);

            font-size: clamp(22px, 2.2vw, 34px);
            font-weight: 800;
            letter-spacing: 7px;
            line-height: 1.1;

            text-align: center;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 5px;

            cursor: pointer;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .theme-button:hover {
            background: var(--blue-deep);
            border-color: var(--blue-deep);
            color: var(--white);

            transform: translateY(-4px);

            box-shadow: 0 10px 24px rgba(7, 84, 135, 0.15);
        }

        .theme-button:active {
            transform: translateY(-1px);
        }

        .theme-button:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 5px;
        }

        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 1100px) {
            .theme-page {
                padding: 65px 5vw 65px;
            }

            .page-title {
                font-size: clamp(60px, 9vw, 100px);
                margin-bottom: 75px;
            }

            .theme-grid {
                max-width: 900px;
                column-gap: 65px;
                row-gap: 65px;
            }

            .theme-button {
                min-height: 65px;
                padding: 12px 18px;

                font-size: clamp(20px, 3vw, 29px);
                letter-spacing: 5px;
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {
            /* Hamburger */

            .menu-button {
                top: clamp(24px, 4vh, 38px);
                left: clamp(20px, 5vw, 30px);

                width: 48px;
                height: 37px;
                padding: 3px 0;
            }

            .menu-button span {
                width: 48px;
                height: 4px;
            }

            .menu-button.active span:nth-child(1) {
                transform: translateY(13px) rotate(45deg);
            }

            .menu-button.active span:nth-child(3) {
                transform: translateY(-13px) rotate(-45deg);
            }

            /* Side menu */

            .side-menu {
                width: min(320px, 82vw);
                max-width: 82vw;
            }

            .side-menu-content {
                width: 78%;
                max-height: 100%;

                padding-top: 105px;
                padding-bottom: 35px;

                gap: 14px;
            }

            .side-menu-content a {
                font-size: 16px;
                padding: 11px 0 12px;
            }

            .menu-section-title {
                font-size: 10px;
                letter-spacing: 2.5px;
                margin-top: 15px;
            }

            /* Top gradient */

            .top-scroll-protection {
                height: 105px;

                background: linear-gradient(
                    to bottom,
                    rgba(238, 246, 252, 1) 0%,
                    rgba(238, 246, 252, 1) 45%,
                    rgba(238, 246, 252, 0.96) 55%,
                    rgba(238, 246, 252, 0.76) 68%,
                    rgba(238, 246, 252, 0.40) 83%,
                    rgba(238, 246, 252, 0.14) 93%,
                    rgba(238, 246, 252, 0) 100%
                );
            }

            /* Main page */

            .theme-page {
                min-height: 100vh;
                padding: 125px 25px 55px;
            }

            .page-title {
                margin-bottom: 65px;

                font-size: clamp(47px, 10vw, 66px);
                letter-spacing: -2px;
            }

            /* Theme grid */

            .theme-grid {
                width: 100%;
                max-width: 520px;

                grid-template-columns: 1fr;
                gap: 27px;
            }

            .theme-button {
                width: 100%;
                min-height: 61px;

                padding: 12px 20px;

                font-size: 22px;
                letter-spacing: 5px;
            }
        }

        /* =====================================================
           VERY SMALL MOBILE
        ===================================================== */

        @media (max-width: 380px) {
            .menu-button {
                top: 23px;
                left: 18px;

                width: 44px;
                height: 34px;
            }

            .menu-button span {
                width: 44px;
                height: 4px;
            }

            .menu-button.active span:nth-child(1) {
                transform: translateY(11px) rotate(45deg);
            }

            .menu-button.active span:nth-child(3) {
                transform: translateY(-11px) rotate(-45deg);
            }

            .side-menu {
                width: 82vw;
                max-width: 82vw;
            }

            .theme-page {
                padding: 115px 20px 45px;
            }

            .page-title {
                margin-bottom: 50px;
                font-size: 43px;
                letter-spacing: -1.5px;
            }

            .theme-grid {
                gap: 23px;
            }

            .theme-button {
                min-height: 56px;

                font-size: 19px;
                letter-spacing: 4px;

                border-width: 2.5px;
            }
        }

        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- TOP GRADIENT PROTECTION -->
    <div
        class="top-scroll-protection"
        id="scrollProtection"
        aria-hidden="true"
    ></div>


    <!-- HAMBURGER BUTTON -->
    <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Buka menu"
        aria-expanded="false"
        aria-controls="sideMenu"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>


    <!-- OVERLAY -->
    <div
        class="overlay"
        id="overlay"
        aria-hidden="true"
    ></div>


    <!-- SIDE MENU -->
    <aside
        class="side-menu"
        id="sideMenu"
        aria-hidden="true"
        inert
    >
        <nav
            class="side-menu-content"
            aria-label="Navigasi utama"
        >

            <!-- EXPLORE -->
            <div class="menu-section-title">
                EXPLORE
            </div>

            <a href="index.html" class="menu-link">
                Home
            </a>

            <a href="tentang.html" class="menu-link">
                Tentang Exhibition
            </a>

            <a href="profil-dosen.html" class="menu-link">
                Profil Dosen
            </a>

            <a href="profil-asisten.html" class="menu-link">
                Profil Asisten
            </a>

            <a
                href="menu.html"
                class="menu-link current-page"
                aria-current="page"
            >
                Our Theme
            </a>


            <!-- PARTICIPATE -->
            <div class="menu-section-title">
                PARTICIPATE
            </div>

            <a href="voting.html" class="menu-link">
                Vote
            </a>

        </nav>
    </aside>


    <!-- MAIN CONTENT -->
    <main class="theme-page">

        <h1 class="page-title">
            OUR THEME
        </h1>

        <nav
            class="theme-grid"
            aria-label="Daftar tema"
        >

            <a href="tema1.html" class="theme-button">
                TEMA 1
            </a>

            <a href="tema4.html" class="theme-button">
                TEMA 4
            </a>

            <a href="tema2.html" class="theme-button">
                TEMA 2
            </a>

            <a href="tema5.html" class="theme-button">
                TEMA 5
            </a>

            <a href="tema3.html" class="theme-button">
                TEMA 3
            </a>

            <a href="tema6.html" class="theme-button">
                TEMA 6
            </a>

        </nav>

    </main>


    <script>
        /* =====================================================
           ELEMENT REFERENCES
        ===================================================== */

        const menuButton = document.getElementById("menuButton");
        const sideMenu = document.getElementById("sideMenu");
        const overlay = document.getElementById("overlay");
        const scrollProtection = document.getElementById("scrollProtection");

        let previousFocus = null;


        /* =====================================================
           OPEN MENU
        ===================================================== */

        function openMenu() {
            previousFocus = document.activeElement;

            menuButton.classList.add("active");
            sideMenu.classList.add("active");
            overlay.classList.add("active");

            sideMenu.setAttribute("aria-hidden", "false");
            sideMenu.removeAttribute("inert");

            overlay.setAttribute("aria-hidden", "false");

            menuButton.setAttribute("aria-expanded", "true");
            menuButton.setAttribute("aria-label", "Tutup menu");

            document.body.classList.add("menu-open");

            scrollProtection.classList.remove("active");

            /* Fokus ke tautan pertama ketika menu dibuka */
            const firstLink = sideMenu.querySelector("a");

            if (firstLink) {
                firstLink.focus({ preventScroll: true });
            }
        }


        /* =====================================================
           CLOSE MENU
        ===================================================== */

        function closeMenu(restoreFocus = false) {
            menuButton.classList.remove("active");
            sideMenu.classList.remove("active");
            overlay.classList.remove("active");

            sideMenu.setAttribute("aria-hidden", "true");
            sideMenu.setAttribute("inert", "");

            overlay.setAttribute("aria-hidden", "true");

            menuButton.setAttribute("aria-expanded", "false");
            menuButton.setAttribute("aria-label", "Buka menu");

            document.body.classList.remove("menu-open");

            if (restoreFocus) {
                menuButton.focus({ preventScroll: true });
            } else if (
                previousFocus &&
                previousFocus !== menuButton &&
                typeof previousFocus.focus === "function"
            ) {
                previousFocus.focus({ preventScroll: true });
            }

            checkTopContentCollision();
        }


        /* =====================================================
           TOGGLE HAMBURGER
        ===================================================== */

        menuButton.addEventListener("click", function () {
            if (sideMenu.classList.contains("active")) {
                closeMenu(true);
            } else {
                openMenu();
            }
        });


        /* =====================================================
           OVERLAY CLICK
        ===================================================== */

        overlay.addEventListener("click", function () {
            closeMenu(true);
        });


        /* =====================================================
           CLOSE AFTER NAVIGATION
        ===================================================== */

        sideMenu.querySelectorAll("a").forEach(function (link) {
            link.addEventListener("click", function () {
                closeMenu(false);
            });
        });


        /* =====================================================
           ESCAPE KEY
        ===================================================== */

        document.addEventListener("keydown", function (event) {
            if (
                event.key === "Escape" &&
                sideMenu.classList.contains("active")
            ) {
                closeMenu(true);
            }
        });


        /* =====================================================
           TOP GRADIENT PROTECTION
        ===================================================== */

        function checkTopContentCollision() {
            if (
                document.body.classList.contains("menu-open") ||
                window.scrollY <= 10
            ) {
                scrollProtection.classList.remove("active");
                return;
            }

            const protectionHeight =
                window.innerWidth <= 768 ? 105 : 115;

            const elements = document.querySelectorAll(
                ".page-title, .theme-button"
            );

            let collision = false;

            elements.forEach(function (element) {
                const rect = element.getBoundingClientRect();

                if (
                    rect.top < protectionHeight &&
                    rect.bottom > 0
                ) {
                    collision = true;
                }
            });

            scrollProtection.classList.toggle("active", collision);
        }


        /* =====================================================
           SCROLL & RESIZE EVENTS
        ===================================================== */

        window.addEventListener(
            "scroll",
            checkTopContentCollision,
            { passive: true }
        );

        window.addEventListener(
            "resize",
            checkTopContentCollision
        );


        /* =====================================================
           INITIALIZE
        ===================================================== */

        checkTopContentCollision();
    </script>

</body>
</html>
