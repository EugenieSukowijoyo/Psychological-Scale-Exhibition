<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Psychological Scale Exhibition</title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&family=Oswald:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           ROOT
        ====================================================== */

        :root {

            --blue: #1464c4;
            --blue-dark: #07578d;
            --blue-deep: #075487;
            --blue-soft: #dfeefa;

            --ink: #111111;
            --white: #ffffff;

        }


        /* =====================================================
           RESET
        ====================================================== */

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }


        html,
        body {

            width: 100%;
            height: 100%;

        }


        body {

            font-family:
                'Montserrat',
                sans-serif;

            overflow: hidden;

            background:
                #eef6fc;

            color:
                var(--ink);

        }


        button,
        a {

            font-family:
                inherit;

        }


        /* =====================================================
           HERO
        ====================================================== */

        .hero {

            width: 100%;
            height: 100vh;

            min-height: 620px;

            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding:
                0 40px;

            overflow: hidden;

            background:

                linear-gradient(
                    rgba(244, 249, 253, 0.42),
                    rgba(244, 249, 253, 0.42)
                ),

                url("assets/background.png");

            background-size:
                cover;

            background-position:
                center;

            background-repeat:
                no-repeat;

            color:
                var(--ink);

            transition:
                filter 0.4s ease;

        }


        /* =====================================================
           LOGO
        ====================================================== */

        .brand-logo {

            position: absolute;

            top: 30px;

            left: 50%;

            transform:
                translateX(-50%);

            width:
                min(390px, 32vw);

            max-height:
                100px;

            object-fit:
                contain;

            object-position:
                center;

            z-index:
                850;

            transition:
                opacity 0.3s ease;

        }


        /* =====================================================
           MAIN TITLE
        ====================================================== */

        .title {

            position: absolute;

            top: 21%;

            left: 50%;

            transform:
                translateX(-50%);

            width:
                98%;

            text-align:
                center;

            color:
                var(--blue);

            font-family:
                'League Spartan',
                sans-serif;

            font-size:
                clamp(
                    70px,
                    8.6vw,
                    145px
                );

            line-height:
                0.88;

            font-weight:
                800;

            letter-spacing:
                -5px;

            white-space:
                nowrap;

        }


        /* =====================================================
           TAGLINE
        ====================================================== */

        .title span {

            display:
                block;

            margin-top:
                10px;

            font-family:
                'Oswald',
                sans-serif;

            font-size:
                0.50em;

            line-height:
                0.95;

            font-weight:
                700;

            font-style:
                italic;

            letter-spacing:
                -1.5px;

            text-transform:
                uppercase;

        }


        /* =====================================================
           SUBTITLE
        ====================================================== */

        .subtitle {

            position:
                absolute;

            top:
                50.5%;

            left:
                50%;

            transform:
                translateX(-50%);

            width:
                max-content;

            max-width:
                90%;

            margin:
                0;

            font-family:
                'Montserrat',
                sans-serif;

            font-size:
                clamp(
                    18px,
                    2vw,
                    31px
                );

            font-weight:
                400;

            line-height:
                1.2;

            letter-spacing:
                0.2px;

            text-align:
                center;

            color:
                var(--ink);

        }


        /* =====================================================
           HAMBURGER BUTTON
        ====================================================== */

        .menu-button {

            position:
                fixed;

            top:
                38px;

            left:
                30px;

            width:
                64px;

            height:
                48px;

            padding:
                4px 0;

            border:
                none;

            background:
                transparent;

            cursor:
                pointer;

            z-index:
                1200;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                space-between;

            transition:
                opacity 0.3s ease;

        }


        /* =====================================================
           HAMBURGER LINES
        ====================================================== */

        .menu-button span {

            width:
                64px;

            height:
                5px;

            background:
                var(--blue-deep);

            border-radius:
                0;

            display:
                block;

            transition:

                transform
                0.35s ease,

                opacity
                0.25s ease,

                background
                0.25s ease;

        }


        /* =====================================================
           HAMBURGER → X
        ====================================================== */

        .menu-button.active
        span:nth-child(1) {

            transform:
                translateY(17px)
                rotate(45deg);

            background:
                var(--white);

        }


        .menu-button.active
        span:nth-child(2) {

            opacity:
                0;

        }


        .menu-button.active
        span:nth-child(3) {

            transform:
                translateY(-17px)
                rotate(-45deg);

            background:
                var(--white);

        }


        /* =====================================================
           THEME NAVIGATION
        ====================================================== */

        .theme-navigation {

            position:
                absolute;

            bottom:
                27%;

            left:
                50%;

            transform:
                translateX(-50%);

            width:
                min(52%, 820px);

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

        }


        /* =====================================================
           THEME BUTTON
        ====================================================== */

        .theme-button {

            position:
                relative;

            color:
                var(--ink);

            text-decoration:
                none;

            font-family:
                'Montserrat',
                sans-serif;

            font-size:
                clamp(
                    17px,
                    1.55vw,
                    26px
                );

            font-weight:
                700;

            letter-spacing:
                7px;

            padding:
                8px 12px 9px;

            transition:

                transform
                0.3s ease,

                opacity
                0.3s ease;

        }


        .theme-button::after {

            content:
                "";

            position:
                absolute;

            left:
                10px;

            right:
                10px;

            bottom:
                0;

            height:
                2px;

            background:
                var(--ink);

            transform:
                scaleX(1);

            transition:

                transform
                0.3s ease,

                height
                0.3s ease;

        }


        .theme-button:hover {

            transform:
                translateY(-4px);

        }


        .theme-button:hover::after {

            height:
                3px;

        }


        /* =====================================================
           VOTING AREA
        ====================================================== */

        .voting-area {

            position:
                absolute;

            bottom:
                10.5%;

            left:
                50%;

            transform:
                translateX(-50%);

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

        }


        /* =====================================================
           VOTE BUTTON
        ====================================================== */

        .vote-button {

            min-width:
                280px;

            min-height:
                72px;

            padding:
                13px 45px;

            color:
                var(--blue-deep);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            border:
                3px solid
                var(--blue-deep);

            border-radius:
                42px;

            text-decoration:
                none;

            font-family:
                'Montserrat',
                sans-serif;

            font-size:
                18px;

            font-weight:
                800;

            letter-spacing:
                7px;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            transition:

                background
                0.3s ease,

                color
                0.3s ease,

                transform
                0.3s ease,

                box-shadow
                0.3s ease;

        }


        .vote-button:hover {

            background:
                var(--blue-deep);

            color:
                var(--white);

            transform:
                translateY(-4px);

            box-shadow:
                0 10px 25px
                rgba(
                    7,
                    84,
                    135,
                    0.20
                );

        }


        /* =====================================================
           OVERLAY
        ====================================================== */

        .overlay {

            position:
                fixed;

            inset:
                0;

            background:
                rgba(
                    0,
                    38,
                    66,
                    0.35
                );

            opacity:
                0;

            visibility:
                hidden;

            transition:

                opacity
                0.4s ease,

                visibility
                0.4s ease;

            z-index:
                900;

        }


        .overlay.active {

            opacity:
                1;

            visibility:
                visible;

        }


        /* =====================================================
           SIDE MENU
        ====================================================== */

        .side-menu {

            position:
                fixed;

            top:
                0;

            left:
                0;

            width:
                365px;

            max-width:
                40vw;

            height:
                100vh;

            background:
                var(--blue-deep);

            z-index:
                1000;

            transform:
                translateX(-100%);

            transition:
                transform 0.4s ease;

            display:
                flex;

            justify-content:
                flex-start;

            align-items:
                stretch;

            box-shadow:
                8px 0 28px
                rgba(
                    0,
                    0,
                    0,
                    0.10
                );

            overflow:
                hidden;

        }


        .side-menu.active {

            transform:
                translateX(0);

        }


        /* =====================================================
           PROTECTED HEADER / AREA BELAKANG X
        ====================================================== */

        .side-menu::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                0;

            right:
                0;

            height:
                125px;

            background:
                rgba(
                    7,
                    84,
                    135,
                    0.96
                );

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                0 8px 18px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

            z-index:
                2;

            pointer-events:
                none;

        }


        /* =====================================================
           BLUR / FADE TRANSITION
        ====================================================== */

        .side-menu::after {

            content:
                "";

            position:
                absolute;

            top:
                100px;

            left:
                0;

            right:
                0;

            height:
                45px;

            background:
                linear-gradient(
                    to bottom,

                    rgba(
                        7,
                        84,
                        135,
                        0.95
                    ),

                    rgba(
                        7,
                        84,
                        135,
                        0
                    )
                );

            z-index:
                2;

            pointer-events:
                none;

        }


        /* =====================================================
           SIDE MENU CONTENT
           
           POSISI DIKEMBALIKAN SEPERTI DESAIN AWAL
        ====================================================== */

        .side-menu-content {

            position:
                relative;

            z-index:
                1;

            width:
                78%;

            height:
                100%;

            max-height:
                100vh;

            overflow-y:
                auto;

            /*
             * Bagian penting:
             * konten diberi jarak dari kiri
             * supaya tidak menempel ke pinggir.
             */

            padding-top:
                135px;

            padding-left:
                0;

            padding-right:
                0;

            padding-bottom:
                50px;

            margin-left:
                43px;

            display:
                flex;

            flex-direction:
                column;

            gap:
                18px;

            scrollbar-width:
                thin;

            scrollbar-color:

                rgba(
                    255,
                    255,
                    255,
                    0.35
                )

                transparent;

        }


        /* =====================================================
           SCROLLBAR
        ====================================================== */

        .side-menu-content::-webkit-scrollbar {

            width:
                5px;

        }


        .side-menu-content::-webkit-scrollbar-track {

            background:
                transparent;

        }


        .side-menu-content::-webkit-scrollbar-thumb {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            border-radius:
                10px;

        }


        .side-menu-content::-webkit-scrollbar-thumb:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.55
                );

        }


        /* =====================================================
           MENU SECTION TITLE
        ====================================================== */

        .menu-section-title {

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.55
                );

            font-family:
                'Montserrat',
                sans-serif;

            font-size:
                12px;

            font-weight:
                700;

            letter-spacing:
                3px;

            margin-top:
                20px;

            margin-bottom:
                -5px;

        }


        /* =====================================================
           SIDE MENU LINKS
        ====================================================== */

        .side-menu-content a {

            color:
                var(--white);

            text-decoration:
                none;

            font-family:
                'Montserrat',
                sans-serif;

            font-size:
                20px;

            font-weight:
                600;

            letter-spacing:
                1px;

            padding:
                13px 0;

            border-bottom:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

            transition:

                padding-left
                0.3s ease,

                opacity
                0.3s ease;

        }


        .side-menu-content a:hover {

            padding-left:
                10px;

            opacity:
                0.75;

        }


        /* =====================================================
           VIDEO POPUP
        ====================================================== */

        .video-popup {

            position:
                fixed;

            inset:
                0;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            padding:
                30px;

            background:
                rgba(
                    0,
                    25,
                    45,
                    0.78
                );

            opacity:
                0;

            visibility:
                hidden;

            transition:

                opacity
                0.35s ease,

                visibility
                0.35s ease;

            z-index:
                2000;

        }


        .video-popup.active {

            opacity:
                1;

            visibility:
                visible;

        }


        /* =====================================================
           VIDEO POPUP CONTENT
        ====================================================== */

        .video-popup-content {

            position:
                relative;

            width:
                min(
                    1000px,
                    90vw
                );

            background:
                var(--white);

            border-radius:
                18px;

            overflow:
                hidden;

            box-shadow:
                0 25px 70px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

            transform:
                scale(0.92);

            transition:
                transform
                0.35s ease;

        }


        .video-popup.active
        .video-popup-content {

            transform:
                scale(1);

        }


        /* =====================================================
           VIDEO
        ====================================================== */

        .video-popup video {

            display:
                block;

            width:
                100%;

            max-height:
                80vh;

            background:
                #000;

        }


        /* =====================================================
           VIDEO CLOSE
        ====================================================== */

        .video-close {

            position:
                absolute;

            top:
                15px;

            right:
                15px;

            width:
                44px;

            height:
                44px;

            border:
                none;

            border-radius:
                50%;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.65
                );

            color:
                var(--white);

            font-size:
                28px;

            line-height:
                1;

            cursor:
                pointer;

            z-index:
                10;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            transition:

                background
                0.25s ease,

                transform
                0.25s ease;

        }


        .video-close:hover {

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.85
                );

            transform:
                rotate(90deg);

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 1100px) {

            .title {

                font-size:
                    clamp(
                        60px,
                        9vw,
                        115px
                    );

            }


            .theme-navigation {

                width:
                    65%;

            }


            .brand-logo {

                width:
                    min(
                        320px,
                        34vw
                    );

            }

        }


        /* =====================================================
           TABLET / SMALL DESKTOP
        ====================================================== */

        @media (max-width: 768px) {

            .hero {

                min-height:
                    600px;

                padding:

            }


            /* ---------------------------------------------

            ---------------------------------------------- */

            .brand-logo {

                top:
                    28px;

                width:
                    min(
                        260px,
                        48vw
                    );

                max-height:
                    80px;

            }


            /* ---------------------------------------------
               HAMBURGER
            ---------------------------------------------- */

            .menu-button {

                top:
                    28px;

                left:
                    22px;

                width:
                    52px;

                height:
                    40px;

            }


            .menu-button span {

                width:
                    52px;

                height:
                    4px;

            }


            /* ---------------------------------------------

            ---------------------------------------------- */

            .menu-button.active
            span:nth-child(1) {

                transform:

            }


            .menu-button.active
            span:nth-child(3) {

                transform:
                    translateY(-13px)
                    rotate(-45deg);

            }


            /* ---------------------------------------------
               TITLE
            ---------------------------------------------- */

            .title {

                top:
                    24%;

                width:
                    100%;

                font-size:
                    clamp(
                        52px,
                        12vw,
                        82px
                    );

                letter-spacing:
                    -3px;

            }


            .title span {

                margin-top:
                    8px;

                font-size:
                    0.52em;

                letter-spacing:
                    -1px;

            }


            /* ---------------------------------------------
               SUBTITLE
            ---------------------------------------------- */

            .subtitle {

                top:
                    51%;

                width:
                    90%;

                font-size:
                    clamp(
                        15px,
                        3vw,
                        22px
                    );

            }


            /* ---------------------------------------------
               THEMES
            ---------------------------------------------- */

            .theme-navigation {

                bottom:
                    25%;

                width:
                    80%;

            }


            .theme-button {

                font-size:
                    15px;

                letter-spacing:
                    4px;

                padding:
                    6px;

            }


            .theme-button::after {

                left:
                    6px;

                right:
                    6px;

            }


            /* ---------------------------------------------
               VOTE
            ---------------------------------------------- */

            .voting-area {

                bottom:
                    10%;

            }


            .vote-button {

                min-width:
                    230px;

                min-height:
                    62px;

                padding:
                    11px 30px;

                font-size:
                    15px;

                letter-spacing:
                    5px;

            }


            /* ---------------------------------------------
               SIDE MENU
            ---------------------------------------------- */

            .side-menu {

                width:
                    310px;

                max-width:
                    82vw;

            }


            /* ---------------------------------------------
               PROTECTED HEADER
            ---------------------------------------------- */

            .side-menu::before {

                height:
                    110px;

            }


            .side-menu::after {

                top:
                    88px;

            }


            /* ---------------------------------------------

            ---------------------------------------------- */

            .side-menu-content {

                padding-top:

                padding-bottom:

            }


            .side-menu-content a {

            }

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 480px) {

            .hero {

                min-height:
                    560px;

            }


            /* ---------------------------------------------
               LOGO
            ---------------------------------------------- */

            .brand-logo {

                top:
                    24px;

                width:
                    200px;

                max-height:
                    65px;

            }


            /* ---------------------------------------------
               HAMBURGER
            ---------------------------------------------- */

            .menu-button {

                top:
                    25px;

                left:
                    18px;

                width:
                    46px;

                height:
                    36px;

            }


            .menu-button span {

                width:
                    46px;

                height:
                    4px;

            }


            /* ---------------------------------------------
               X
            ---------------------------------------------- */

            .menu-button.active
            span:nth-child(1) {

                transform:
                    translateY(11px)
                    rotate(45deg);

            }


            .menu-button.active
            span:nth-child(3) {

                transform:
                    translateY(-11px)
                    rotate(-45deg);

            }


            /* ---------------------------------------------
               TITLE
            ---------------------------------------------- */

            .title {

                top:
                    26%;

                font-size:
                    clamp(
                        42px,
                        14vw,
                        64px
                    );

                letter-spacing:
                    -2px;

            }


            .title span {

                    0.53em;

                letter-spacing:

            }


            /* ---------------------------------------------
               SUBTITLE
            ---------------------------------------------- */

            .subtitle {

                top:
                    51.5%;

                font-size:
                    14px;

                line-height:

            }


            /* ---------------------------------------------
               THEMES
            ---------------------------------------------- */

            .theme-navigation {

            }


            .theme-button {

                font-size:
                    12px;

                letter-spacing:
                    2px;

                padding:

            }


            .theme-button::after {

                left:

                right:

                height:
                    1.5px;

            }


            /* ---------------------------------------------
               VOTE
            ---------------------------------------------- */

            .voting-area {

                bottom:
                    9%;

            }


            .vote-button {

                min-width:
                    190px;

                min-height:
                    54px;

                padding:
                    9px 22px;

                font-size:
                    13px;

                letter-spacing:
                    4px;

                border-width:
                    2px;

            }


            /* ---------------------------------------------
               SIDE MENU
            ---------------------------------------------- */

            .side-menu {

                width:
                    85vw;

            }


            /* ---------------------------------------------
               PROTECTED HEADER
            ---------------------------------------------- */

            .side-menu::before {

                height:
                    100px;

            }


            .side-menu::after {

                    80px;

                height:
                    35px;

            }


            /* ---------------------------------------------
               MENU CONTENT
               POSISI TETAP TIDAK MEPET
            ---------------------------------------------- */

            .side-menu-content {

                width:
                    82%;

                height:
                    100%;

                max-height:
                    100vh;

                    110px;

                padding-left:
                    0;

            /* ---------------------------------------------

                    38px;

                height:
                    38px;

                top:
                    10px;

                right:
                    10px;

                font-size:
                    24px;

            }

        }

    </style>

</head>


<body>

    <aside

        aria-hidden="true"
    >

        <nav

        >


            <!-- =============================================
                 EXPLORE

            <div class="menu-section-title">

    <!-- =====================================================
         INTRO VIDEO POPUP
    ====================================================== -->

    <div
        class="video-popup"
        id="videoPopup"
        aria-hidden="true"
    >

        <div
            class="video-popup-content"
            id="videoPopupContent"
        >


            <button
                class="video-close"
                id="videoClose"
                type="button"
                aria-label="Tutup video"
            >
                ×
            </button>


            <video
                id="introVideo"
                controls
                playsinline
                preload="metadata"
            >

                <source
                    src="assets/tentang.mp4"
                    type="video/mp4"
                >

                Browser Anda tidak mendukung
                pemutaran video.

            </video>


        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           VIDEO POPUP
        ====================================================== */

        const videoPopup =
            document.getElementById(
                "videoPopup"
            );


        const videoClose =
            document.getElementById(
                "videoClose"
            );


        const introVideo =
            document.getElementById(
                "introVideo"
            );


        const INTRO_STORAGE_KEY =
            "psychologicalScaleIntroSeen";


        /* =====================================================
           SHOW VIDEO
        ====================================================== */

        function showVideoPopup() {

            videoPopup.classList.add(
                "active"
            );

            videoPopup.setAttribute(
                "aria-hidden",
                "false"
            );

            document.body.style.overflow =
                "hidden";

        }


        /* =====================================================
           CLOSE VIDEO
        ====================================================== */

        function closeVideoPopup() {

            videoPopup.classList.remove(
                "active"
            );

            videoPopup.setAttribute(
                "aria-hidden",
                "true"
            );

            document.body.style.overflow =
                "hidden";


            if (introVideo) {

                introVideo.pause();

                introVideo.currentTime =
                    0;

            }


            localStorage.setItem(
                INTRO_STORAGE_KEY,
                "true"
            );

        }


        /* =====================================================
           FIRST VISIT
        ====================================================== */

        window.addEventListener(
            "load",
            function () {

                const hasSeenIntro =
                    localStorage.getItem(
                        INTRO_STORAGE_KEY
                    );


                if (!hasSeenIntro) {

                    setTimeout(
                        function () {

                            showVideoPopup();

                        },
                        300
                    );

                }

            }
        );


        /* =====================================================
           VIDEO CLOSE BUTTON
        ====================================================== */

        if (videoClose) {

            videoClose.addEventListener(
                "click",
                closeVideoPopup
            );

        }


        /* =====================================================
           CLICK OUTSIDE VIDEO
        ====================================================== */

        if (videoPopup) {

            videoPopup.addEventListener(
                "click",
                function (event) {

                    if (
                        event.target ===
                        videoPopup
                    ) {

                        closeVideoPopup();

                    }

                }
            );

        }


        /* =====================================================
           MENU ELEMENTS
        ====================================================== */

        const menuButton =
            document.getElementById(
                "menuButton"
            );


        const sideMenu =
            document.getElementById(
                "sideMenu"
            );


        const overlay =
            document.getElementById(
                "overlay"
            );


        /* =====================================================
           OPEN MENU
        ====================================================== */

        function openMenu() {

            menuButton.classList.add(
                "active"
            );


            sideMenu.classList.add(
                "active"
            );


            overlay.classList.add(
                "active"
            );


            sideMenu.setAttribute(
                "aria-hidden",
                "false"
            );


            menuButton.setAttribute(
                "aria-expanded",
                "true"
            );


            menuButton.setAttribute(
                "aria-label",
                "Tutup menu"
            );


            document.body.classList.add(
                "menu-open"
            );

        }


        /* =====================================================
           CLOSE MENU
        ====================================================== */

        function closeMenu() {

            menuButton.classList.remove(
                "active"
            );


            sideMenu.classList.remove(
                "active"
            );


            overlay.classList.remove(
                "active"
            );


            sideMenu.setAttribute(
                "aria-hidden",
                "true"
            );


            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );


            menuButton.setAttribute(
                "aria-label",
                "Buka menu"
            );


            document.body.classList.remove(
                "menu-open"
            );

        }


        /* =====================================================
           TOGGLE MENU
        ====================================================== */

        if (menuButton) {

            menuButton.addEventListener(
                "click",
                function () {

                    if (
                        sideMenu.classList.contains(
                            "active"
                        )
                    ) {

                        closeMenu();

                    } else {

                        openMenu();

                    }

                }
            );

        }


        /* =====================================================
           OVERLAY CLICK
        ====================================================== */

        if (overlay) {

            overlay.addEventListener(
                "click",
                closeMenu
            );

        }


        /* =====================================================
           MENU LINKS
        ====================================================== */

        const menuLinks =
            document.querySelectorAll(
                ".side-menu a"
            );


        menuLinks.forEach(
            function (link) {

                link.addEventListener(
                    "click",
                    function () {

                        closeMenu();

                    }
                );

            }
        );


        /* =====================================================
           ESCAPE KEY
        ====================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key ===
                    "Escape"
                ) {


                    if (
                        sideMenu.classList.contains(
                            "active"
                        )
                    ) {

                        closeMenu();

                    }


                    if (
                        videoPopup.classList.contains(
                            "active"
                        )
                    ) {

                        closeVideoPopup();

                    }

                }

            }
        );


    </script>


</body>
