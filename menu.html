<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Theme | Psychological Scale Exhibition</title>

    <!-- GOOGLE FONTS -->
    <link
        href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =====================================================
           RESET & VARIABLES
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #1464c4;
            --blue-dark: #07578d;
            --blue-deep: #075487;
            --white: #ffffff;
            --black: #111111;
            --light-bg: #eef6fc;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Montserrat', Arial, sans-serif;
            color: var(--black);

            background-image: url("assets/background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            overflow-x: hidden;
            overflow-y: auto;
        }

        /* =====================================================
           TOP GRADIENT PROTECTION
        ===================================================== */

        .top-scroll-protection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 115px;

            background: linear-gradient(
                to bottom,
                rgba(238, 246, 252, 1) 0%,
                rgba(238, 246, 252, 1) 42%,
                rgba(238, 246, 252, 0.96) 52%,
                rgba(238, 246, 252, 0.78) 65%,
                rgba(238, 246, 252, 0.45) 80%,
                rgba(238, 246, 252, 0.18) 91%,
                rgba(238, 246, 252, 0) 100%
            );

            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            z-index: 1100;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .top-scroll-protection.active {
            opacity: 1;
            visibility: visible;
        }

        body.menu-open .top-scroll-protection {
            opacity: 0;
            visibility: hidden;
        }

        /* =====================================================
           HAMBURGER BUTTON
        ===================================================== */

        .menu-button {
            position: fixed;
            top: 38px;
            left: 30px;

            width: 64px;
            height: 48px;
            padding: 4px 0;

            border: none;
            background: transparent;
            cursor: pointer;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            z-index: 1300;
        }

        .menu-button span {
            display: block;
            width: 64px;
            height: 5px;

            background: var(--blue-deep);

            transition:
                transform 0.35s ease,
                opacity 0.25s ease,
                background 0.25s ease;
        }

        .menu-button.active span:nth-child(1) {
            transform: translateY(17px) rotate(45deg);
            background: white;
        }

        .menu-button.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-button.active span:nth-child(3) {
            transform: translateY(-17px) rotate(-45deg);
            background: white;
        }

        /* =====================================================
           OVERLAY
        ===================================================== */

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 38, 66, 0.38);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.35s ease,
                visibility 0.35s ease;

            z-index: 1150;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* =====================================================
           SIDE MENU
        ===================================================== */

        .side-menu {
            position: fixed;
            top: 0;
            left: 0;

            width: 365px;
            max-width: 40vw;
            height: 100vh;

            background: var(--blue-deep);

            transform: translateX(-100%);
            transition: transform 0.4s ease;

            overflow-y: auto;
            overflow-x: hidden;

            z-index: 1200;

            box-shadow: 8px 0 30px rgba(0, 0, 0, 0.12);
        }

        .side-menu.active {
            transform: translateX(0);
        }

        .side-menu-inner {
            width: 100%;
            min-height: 100%;
            padding: 118px 43px 55px;
        }

        .menu-label,
        .menu-section-title {
            margin-bottom: 22px;

            color: rgba(255, 255, 255, 0.55);

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .menu-link {
            display: block;
            width: 100%;

            padding: 16px 0;

            border-bottom: 1px solid rgba(255, 255, 255, 0.20);

            color: white;
            text-decoration: none;

            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;

            transition:
                color 0.25s ease,
                padding-left 0.25s ease;
        }

        .menu-link:hover {
            color: #dcecff;
            padding-left: 7px;
        }

        .menu-section {
            margin-top: 34px;
        }

        .menu-section-title {
            margin-bottom: 3px;
        }

        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .theme-page {
            width: 100%;
            min-height: 100vh;

            padding: 55px 7vw 75px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =====================================================
           TITLE
        ===================================================== */

        .page-title {
            margin: 0 0 95px;

            color: var(--blue);

            font-family: 'League Spartan', sans-serif;
            font-size: clamp(64px, 7.5vw, 120px);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -3px;

            text-align: center;
            text-transform: uppercase;
        }

        /* =====================================================
           THEME BUTTON GRID
        ===================================================== */

        .theme-grid {
            width: 100%;
            max-width: 1150px;

            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));

            column-gap: clamp(55px, 14vw, 240px);
            row-gap: 85px;

            align-items: center;
        }

        /* =====================================================
           THEME BUTTON
        ===================================================== */

        .theme-button {
            min-width: 0;
            width: 100%;
            min-height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 12px 24px;

            border: 3px solid var(--black);
            border-radius: 100px;

            background: rgba(255, 255, 255, 0.12);

            color: var(--black);

            font-family: 'Montserrat', sans-serif;
            font-size: clamp(22px, 2.2vw, 34px);
            font-weight: 800;
            letter-spacing: 7px;
            line-height: 1.1;

            text-align: center;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 5px;

            cursor: pointer;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .theme-button:hover {
            background: var(--blue-deep);
            border-color: var(--blue-deep);
            color: white;

            transform: translateY(-4px);

            box-shadow: 0 10px 24px rgba(7, 84, 135, 0.15);
        }

        .theme-button:active {
            transform: translateY(-1px);
        }

        .theme-button:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 5px;
        }

        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {
            .theme-page {
                padding: 65px 6vw 65px;
            }

            .page-title {
                margin-bottom: 75px;
                font-size: clamp(60px, 9vw, 85px);
            }

            .theme-grid {
                max-width: 800px;
                column-gap: 55px;
                row-gap: 65px;
            }

            .theme-button {
                min-height: 65px;
                padding: 12px 18px;
                font-size: clamp(20px, 3vw, 27px);
                letter-spacing: 5px;
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {
            .top-scroll-protection {
                height: 105px;

                background: linear-gradient(
                    to bottom,
                    rgba(238, 246, 252, 1) 0%,
                    rgba(238, 246, 252, 1) 45%,
                    rgba(238, 246, 252, 0.96) 55%,
                    rgba(238, 246, 252, 0.76) 68%,
                    rgba(238, 246, 252, 0.40) 83%,
                    rgba(238, 246, 252, 0.14) 93%,
                    rgba(238, 246, 252, 0) 100%
                );
            }

            /* HAMBURGER */

            .menu-button {
                top: 28px;
                left: 24px;
                width: 54px;
                height: 42px;
            }

            .menu-button span {
                width: 54px;
                height: 4px;
            }

            .menu-button.active span:nth-child(1) {
                transform: translateY(15px) rotate(45deg);
            }

            .menu-button.active span:nth-child(3) {
                transform: translateY(-15px) rotate(-45deg);
            }

            /* SIDE MENU */

            .side-menu {
                width: min(350px, 88vw);
                max-width: 88vw;
            }

            .side-menu-inner {
                padding: 105px 35px 50px;
            }

            .menu-link {
                font-size: 18px;
            }

            /* MAIN */

            .theme-page {
                min-height: 100vh;
                padding: 125px 25px 55px;
            }

            .page-title {
                margin-bottom: 65px;
                font-size: clamp(47px, 10vw, 66px);
                letter-spacing: -2px;
            }

            /* GRID */

            .theme-grid {
                width: 100%;
                max-width: 520px;

                grid-template-columns: 1fr;
                gap: 27px;
            }

            /* BUTTONS */

            .theme-button {
                width: 100%;
                min-height: 61px;

                padding: 12px 20px;

                font-size: 22px;
                letter-spacing: 5px;
            }
        }

        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 400px) {
            .theme-page {
                padding: 115px 20px 45px;
            }

            .page-title {
                margin-bottom: 50px;
                font-size: 43px;
                letter-spacing: -1.5px;
            }

            .theme-grid {
                gap: 23px;
            }

            .theme-button {
                min-height: 56px;
                font-size: 19px;
                letter-spacing: 4px;
                border-width: 2.5px;
            }
        }

        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>


<body>

    <!-- TOP GRADIENT PROTECTION -->
    <div
        class="top-scroll-protection"
        id="scrollProtection"
        aria-hidden="true"
    ></div>


    <!-- OVERLAY -->
    <div
        class="overlay"
        id="overlay"
    ></div>


    <!-- HAMBURGER -->
    <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Buka menu"
        aria-expanded="false"
        aria-controls="sideMenu"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>


    <!-- SIDE MENU -->
    <aside
        class="side-menu"
        id="sideMenu"
        aria-hidden="true"
    >
        <div class="side-menu-inner">

            <div class="menu-label">
                EXPLORE
            </div>
            
            <a href="index.html" class="menu-link">
                Home
            </a>
            
            <a href="tentang.html" class="menu-link">
                Tentang Exhibition
            </a>

            <a href="profil-dosen.html" class="menu-link">
                Profil Dosen
            </a>

            <a href="profil-asisten.html" class="menu-link">
                Profil Asisten
            </a>

            <a href="menu.html" class="menu-link">
                Our Theme
            </a>


            <div class="menu-section">

                <div class="menu-section-title">
                    TEMA
                </div>

                <a href="tema1.html" class="menu-link">
                    Tema 1
                </a>

                <a href="tema2.html" class="menu-link">
                    Tema 2
                </a>

                <a href="tema3.html" class="menu-link">
                    Tema 3
                </a>

            </div>


            <div class="menu-section">

                <div class="menu-section-title">
                    PARTICIPATE
                </div>

                <a href="voting.html" class="menu-link">
                    Vote
                </a>

            </div>

        </div>
    </aside>


    <!-- MAIN PAGE -->
    <main class="theme-page">

        <h1 class="page-title">
            OUR THEME
        </h1>


        <!-- THEME BUTTONS -->
        <nav
            class="theme-grid"
            aria-label="Daftar tema"
        >

            <a href="tema1.html" class="theme-button">
                TEMA 1
            </a>

            <a href="tema2.html" class="theme-button">
                TEMA 2
            </a>

            <a href="tema3.html" class="theme-button">
                TEMA 3
            </a>

            <a href="tema4.html" class="theme-button">
                TEMA 4
            </a>

            <a href="tema5.html" class="theme-button">
                TEMA 5
            </a>

            <a href="tema6.html" class="theme-button">
                TEMA 6
            </a>

        </nav>

    </main>


    <script>
        /* =====================================================
           MENU ELEMENTS
        ===================================================== */

        const menuButton = document.getElementById("menuButton");
        const sideMenu = document.getElementById("sideMenu");
        const overlay = document.getElementById("overlay");
        const scrollProtection = document.getElementById("scrollProtection");


        /* =====================================================
           OPEN MENU
        ===================================================== */

        function openMenu() {
            menuButton.classList.add("active");
            sideMenu.classList.add("active");
            overlay.classList.add("active");

            sideMenu.setAttribute("aria-hidden", "false");
            menuButton.setAttribute("aria-expanded", "true");
            menuButton.setAttribute("aria-label", "Tutup menu");

            document.body.classList.add("menu-open");

            scrollProtection.classList.remove("active");
        }


        /* =====================================================
           CLOSE MENU
        ===================================================== */

        function closeMenu() {
            menuButton.classList.remove("active");
            sideMenu.classList.remove("active");
            overlay.classList.remove("active");

            sideMenu.setAttribute("aria-hidden", "true");
            menuButton.setAttribute("aria-expanded", "false");
            menuButton.setAttribute("aria-label", "Buka menu");

            document.body.classList.remove("menu-open");

            checkTopContentCollision();
        }


        /* =====================================================
           TOGGLE MENU
        ===================================================== */

        menuButton.addEventListener("click", function () {
            if (sideMenu.classList.contains("active")) {
                closeMenu();
            } else {
                openMenu();
            }
        });


        /* =====================================================
           OVERLAY CLICK
        ===================================================== */

        overlay.addEventListener("click", closeMenu);


        /* =====================================================
           MENU LINK CLICK
        ===================================================== */

        document.querySelectorAll(".menu-link").forEach(function (link) {
            link.addEventListener("click", closeMenu);
        });


        /* =====================================================
           ESCAPE KEY
        ===================================================== */

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                closeMenu();
            }
        });


        /* =====================================================
           TOP CONTENT COLLISION
        ===================================================== */

        function checkTopContentCollision() {
            if (document.body.classList.contains("menu-open")) {
                scrollProtection.classList.remove("active");
                return;
            }

            if (window.scrollY <= 10) {
                scrollProtection.classList.remove("active");
                return;
            }

            const protectionHeight = window.innerWidth <= 700 ? 105 : 115;

            const elements = document.querySelectorAll(
                ".page-title, .theme-button"
            );

            let collision = false;

            elements.forEach(function (element) {
                const rect = element.getBoundingClientRect();

                if (
                    rect.top < protectionHeight &&
                    rect.bottom > 0
                ) {
                    collision = true;
                }
            });

            scrollProtection.classList.toggle("active", collision);
        }


        /* =====================================================
           SCROLL & RESIZE
        ===================================================== */

        window.addEventListener(
            "scroll",
            checkTopContentCollision,
            { passive: true }
        );

        window.addEventListener(
            "resize",
            checkTopContentCollision
        );


        /* =====================================================
           INITIALIZE
        ===================================================== */

        checkTopContentCollision();
    </script>

</body>
</html>
