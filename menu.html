<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Theme | Psychological Scale Exhibition</title>

    <!-- GOOGLE FONTS -->
    <link
        href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =====================================================
           ROOT & RESET
        ===================================================== */

        :root {
            --blue: #1464c4;
            --blue-dark: #07578d;
            --blue-deep: #075487;
            --white: #ffffff;
            --black: #111111;
            --light-bg: #eef6fc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Montserrat', Arial, sans-serif;
            color: var(--black);

            background-image: url("assets/background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            overflow-x: hidden;
            overflow-y: auto;
        }

        button,
        a {
            font-family: inherit;
        }

        /* =====================================================
           HAMBURGER BUTTON
           PATOKAN UTAMA
        ===================================================== */

        .menu-button {
            position: fixed;
            top: 38px;
            left: 30px;

            width: 64px;
            height: 48px;
            padding: 4px 0;

            border: none;
            background: transparent;
            cursor: pointer;

            z-index: 1200;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;

            -webkit-tap-highlight-color: transparent;

            transition: opacity 0.3s ease;
        }

        /* =====================================================
           FULL-WIDTH PROTECTED AREA

           Muncul ketika konten bertabrakan dengan
           area hamburger saat scrolling.
        ===================================================== */

        .menu-button::before {
            content: "";

            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 105px;

            background: #eef6fc;

            opacity: 0;
            visibility: hidden;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            z-index: -1;
            pointer-events: none;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        /* =====================================================
           FADE DI BAWAH PROTECTED AREA
        ===================================================== */

        .menu-button::after {
            content: "";

            position: fixed;
            top: 105px;
            left: 0;

            width: 100vw;
            height: 35px;

            background: linear-gradient(
                to bottom,
                #eef6fc,
                rgba(238, 246, 252, 0)
            );

            opacity: 0;
            visibility: hidden;

            z-index: -1;
            pointer-events: none;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        /* AKTIF SAAT KONTEN BERTABRAKAN */

        .menu-button.is-obscured::before {
            opacity: 0.97;
            visibility: visible;
        }

        .menu-button.is-obscured::after {
            opacity: 0.95;
            visibility: visible;
        }

        /* PROTECTED AREA HILANG SAAT MENU TERBUKA */

        .menu-button.active::before,
        .menu-button.active::after {
            opacity: 0;
            visibility: hidden;
        }

        /* =====================================================
           HAMBURGER LINES
        ===================================================== */

        .menu-button span {
            display: block;

            width: 64px;
            height: 5px;

            flex-shrink: 0;

            background: var(--blue-deep);
            border-radius: 0;

            transition:
                transform 0.35s ease,
                opacity 0.25s ease,
                background 0.25s ease;
        }

        /* =====================================================
           HAMBURGER MENJADI X
        ===================================================== */

        .menu-button.active span:nth-child(1) {
            transform: translateY(17px) rotate(45deg);
            background: var(--white);
        }

        .menu-button.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-button.active span:nth-child(3) {
            transform: translateY(-17px) rotate(-45deg);
            background: var(--white);
        }

        .menu-button:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 6px;
        }

        /* =====================================================
           OVERLAY
        ===================================================== */

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 38, 66, 0.35);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.4s ease,
                visibility 0.4s ease;

            z-index: 900;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* =====================================================
           SIDE MENU
        ===================================================== */

        .side-menu {
            position: fixed;
            top: 0;
            left: 0;

            width: 365px;
            max-width: 40vw;

            height: 100vh;
            height: 100dvh;

            background: var(--blue-deep);
            color: var(--white);

            z-index: 1000;

            transform: translateX(-100%);
            transition: transform 0.4s ease;

            display: flex;
            justify-content: flex-start;
            align-items: stretch;

            box-shadow: 8px 0 28px rgba(0, 0, 0, 0.10);

            overflow: hidden;
        }

        .side-menu.active {
            transform: translateX(0);
        }

        /* =====================================================
           PROTECTED AREA SIDE MENU
        ===================================================== */

        .side-menu::before {
            content: "";

            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            height: 125px;

            background: rgba(7, 84, 135, 0.96);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);

            z-index: 2;
            pointer-events: none;
        }

        /* =====================================================
           GRADIENT BLUR SIDE MENU
        ===================================================== */

        .side-menu::after {
            content: "";

            position: absolute;
            top: 100px;
            left: 0;
            right: 0;

            height: 45px;

            background: linear-gradient(
                to bottom,
                rgba(7, 84, 135, 0.95),
                rgba(7, 84, 135, 0)
            );

            z-index: 2;
            pointer-events: none;
        }

        /* =====================================================
           SIDE MENU CONTENT
        ===================================================== */

        .side-menu-content {
            position: relative;
            z-index: 1;

            width: 78%;
            height: 100%;
            max-height: 100vh;

            overflow-x: hidden;
            overflow-y: auto;

            padding-top: 135px;
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 50px;

            margin-left: 43px;

            display: flex;
            flex-direction: column;
            gap: 18px;

            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.35) transparent;
        }

        /* SCROLLBAR */

        .side-menu-content::-webkit-scrollbar {
            width: 5px;
        }

        .side-menu-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .side-menu-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.35);
            border-radius: 10px;
        }

        .side-menu-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.55);
        }

        /* =====================================================
           MENU SECTION TITLE
        ===================================================== */

        .menu-section-title {
            color: rgba(255, 255, 255, 0.55);

            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;

            margin-top: 20px;
            margin-bottom: -5px;
        }

        /* =====================================================
           SIDE MENU LINKS
        ===================================================== */

        .side-menu-content a {
            display: block;
            flex-shrink: 0;

            color: var(--white);
            text-decoration: none;

            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            line-height: 1.4;

            padding: 13px 0;

            border-bottom: 1px solid rgba(255, 255, 255, 0.25);

            transition:
                padding-left 0.3s ease,
                opacity 0.3s ease;
        }

        .side-menu-content a:hover {
            padding-left: 10px;
            opacity: 0.75;
        }

        .side-menu-content a:focus-visible {
            outline: 2px solid var(--white);
            outline-offset: 3px;
        }

        .side-menu-content a.current-page {
            color: #c8e5ff;
        }

        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .theme-page {
            width: 100%;
            min-height: 100vh;

            padding: 55px 7vw 75px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =====================================================
           PAGE TITLE
        ===================================================== */

        .page-title {
            margin: 0 0 95px;

            color: var(--blue);

            font-family: 'League Spartan', sans-serif;
            font-size: clamp(64px, 7.5vw, 120px);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -3px;

            text-align: center;
            text-transform: uppercase;
        }

        /* =====================================================
           THEME BUTTON GRID
        ===================================================== */

        .theme-grid {
            width: 100%;
            max-width: 1150px;

            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));

            column-gap: clamp(55px, 14vw, 240px);
            row-gap: 85px;

            align-items: center;
        }

        /* =====================================================
           THEME BUTTON
        ===================================================== */

        .theme-button {
            min-width: 0;
            width: 100%;
            min-height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 12px 24px;

            border: 3px solid var(--black);
            border-radius: 100px;

            background: rgba(255, 255, 255, 0.12);

            color: var(--black);

            font-family: 'Montserrat', sans-serif;
            font-size: clamp(22px, 2.2vw, 34px);
            font-weight: 800;
            letter-spacing: 7px;
            line-height: 1.1;

            text-align: center;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 5px;

            cursor: pointer;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .theme-button:hover {
            background: var(--blue-deep);
            border-color: var(--blue-deep);
            color: var(--white);

            transform: translateY(-4px);

            box-shadow: 0 10px 24px rgba(7, 84, 135, 0.15);
        }

        .theme-button:active {
            transform: translateY(-1px);
        }

        .theme-button:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 5px;
        }

        /* =====================================================
           TOMBOL KEMBALI
        ===================================================== */

        .back-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            max-width: 280px;
            min-height: 58px;

            margin-top: 65px;
            padding: 12px 24px;

            border: 3px solid var(--black);
            border-radius: 100px;

            background: rgba(255, 255, 255, 0.12);
            color: var(--black);

            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 5px;

            text-align: center;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 5px;

            cursor: pointer;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .back-button:hover {
            background: var(--blue-deep);
            border-color: var(--blue-deep);
            color: var(--white);

            transform: translateY(-4px);

            box-shadow: 0 10px 24px rgba(7, 84, 135, 0.15);
        }

        .back-button:active {
            transform: translateY(-1px);
        }

        .back-button:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 5px;
        }

        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {
            .theme-page {
                padding: 65px 6vw 65px;
            }

            .page-title {
                margin-bottom: 75px;
                font-size: clamp(60px, 9vw, 85px);
            }

            .theme-grid {
                max-width: 800px;
                column-gap: 55px;
                row-gap: 65px;
            }

            .theme-button {
                min-height: 65px;
                padding: 12px 18px;
                font-size: clamp(20px, 3vw, 27px);
                letter-spacing: 5px;
            }
        }

        /* =====================================================
           MOBILE / TABLET
        ===================================================== */

        @media (max-width: 700px) {
            /* HAMBURGER MOBILE */

            .menu-button {
                top: 28px;
                left: 22px;

                width: 52px;
                height: 40px;
                padding: 4px 0;
            }

            /* PROTECTED AREA MOBILE */

            .menu-button::before {
                top: 0;
                left: 0;

                width: 100vw;
                height: 82px;

                background: #eef6fc;
            }

            .menu-button::after {
                top: 82px;
                left: 0;

                width: 100vw;
                height: 30px;

                background: linear-gradient(
                    to bottom,
                    #eef6fc,
                    rgba(238, 246, 252, 0)
                );
            }

            /* HAMBURGER LINES MOBILE */

            .menu-button span {
                width: 52px;
                height: 4px;
            }

            .menu-button.active span:nth-child(1) {
                transform: translateY(13px) rotate(45deg);
            }

            .menu-button.active span:nth-child(3) {
                transform: translateY(-13px) rotate(-45deg);
            }

            .menu-button.active::before,
            .menu-button.active::after {
                opacity: 0;
                visibility: hidden;
            }

            /* SIDE MENU MOBILE */

            .side-menu {
                width: 310px;
                max-width: 82vw;
            }

            .side-menu::before {
                height: 110px;
            }

            .side-menu::after {
                top: 88px;
                height: 40px;
            }

            .side-menu-content {
                width: 78%;
                height: 100%;
                max-height: 100vh;

                padding-top: 120px;
                padding-left: 0;
                padding-right: 0;
                padding-bottom: 40px;

                margin-left: 38px;

                gap: 18px;
            }

            .side-menu-content a {
                font-size: 17px;
            }

            /* SECTION TITLE MOBILE */

            .menu-section-title {
                font-size: 11px;
            }

            /* MAIN CONTENT MOBILE */

            .theme-page {
                min-height: 100vh;
                padding: 100px 25px 55px;
            }

            .page-title {
                margin-bottom: 65px;
                font-size: clamp(47px, 10vw, 66px);
                letter-spacing: -2px;
            }

            /* GRID MOBILE */

            .theme-grid {
                width: 100%;
                max-width: 520px;

                grid-template-columns: 1fr;
                gap: 27px;
            }

            /* THEME BUTTONS MOBILE */

            .theme-button {
                width: 100%;
                min-height: 61px;

                padding: 12px 20px;

                font-size: 22px;
                letter-spacing: 5px;
            }

            .back-button {
                max-width: 260px;
                min-height: 55px;
                margin-top: 45px;
                font-size: 18px;
                letter-spacing: 4px;
            }
        }

        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 400px) {
            .menu-button {
                top: 23px;
                left: 18px;

                width: 44px;
                height: 34px;
            }

            .menu-button span {
                width: 44px;
                height: 4px;
            }

            .menu-button.active span:nth-child(1) {
                transform: translateY(11px) rotate(45deg);
            }

            .menu-button.active span:nth-child(3) {
                transform: translateY(-11px) rotate(-45deg);
            }

            .side-menu {
                width: 85vw;
                max-width: 85vw;
            }

            .side-menu::before {
                height: 100px;
            }

            .side-menu::after {
                top: 80px;
                height: 35px;
            }

            .side-menu-content {
                width: 82%;

                padding-top: 110px;
                padding-bottom: 35px;

                margin-left: 30px;
            }

            .side-menu-content a {
                font-size: 16px;
            }

            .menu-section-title {
                font-size: 11px;
            }

            .theme-page {
                padding: 90px 20px 45px;
            }

            .page-title {
                margin-bottom: 50px;
                font-size: 43px;
                letter-spacing: -1.5px;
            }

            .theme-grid {
                gap: 23px;
            }

            .theme-button {
                min-height: 56px;
                font-size: 19px;
                letter-spacing: 4px;
                border-width: 2.5px;
            }

            .back-button {
                min-height: 51px;
                margin-top: 35px;
                font-size: 16px;
                letter-spacing: 3px;
                border-width: 2.5px;
            }
        }

        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         HAMBURGER BUTTON
    ===================================================== -->

    <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Buka menu"
        aria-expanded="false"
        aria-controls="sideMenu"
    >
        <span></span>
        <span></span>
        <span></span>

    <!-- =====================================================

        class="overlay"

    <!-- =====================================================

    <aside

        inert

        <nav
            class="theme-grid"
            aria-label="Daftar tema"
        >

    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>
        /* =====================================================
           MENU ELEMENTS
        ===================================================== */

        const menuButton = document.getElementById("menuButton");
        const sideMenu = document.getElementById("sideMenu");
        const overlay = document.getElementById("overlay");

        /* =====================================================
           COLLISION DETECTION

           Desktop: protected area 105px
           Mobile:  protected area 82px

           Protected area muncul hanya ketika konten
           bertabrakan dengan area hamburger saat scrolling.
        ===================================================== */

        function checkHamburgerCollision() {

            /* Hilangkan protected area ketika menu terbuka */

            if (sideMenu.classList.contains("active")) {
                menuButton.classList.remove("is-obscured");
                return;
            }

            /* Tidak perlu menampilkan efek jika belum scroll */

            if (window.scrollY <= 5) {
                menuButton.classList.remove("is-obscured");
                return;
            }

            /* Tinggi protected area */

            const protectedTop = 0;

            const protectedBottom =
                window.innerWidth <= 700 ? 82 : 105;

            /* Elemen konten yang diperiksa */

            const contentElements = document.querySelectorAll(
                ".page-title, .theme-button"
            );

            let collision = false;

            /* Deteksi tabrakan */

            contentElements.forEach(function (element) {

                const rect = element.getBoundingClientRect();

                if (
                    rect.top < protectedBottom &&
                    rect.bottom > protectedTop
                ) {
                    collision = true;
                }

            });

            /* Aktifkan atau nonaktifkan protected area */

            if (collision) {
                menuButton.classList.add("is-obscured");
            } else {
                menuButton.classList.remove("is-obscured");
            }
        }

        /* =====================================================
           OPEN MENU
        ===================================================== */

        function openMenu() {

            menuButton.classList.add("active");
            menuButton.classList.remove("is-obscured");

            sideMenu.classList.add("active");
            overlay.classList.add("active");

            sideMenu.setAttribute("aria-hidden", "false");
            sideMenu.removeAttribute("inert");

            overlay.setAttribute("aria-hidden", "false");

            menuButton.setAttribute("aria-expanded", "true");
            menuButton.setAttribute("aria-label", "Tutup menu");

            document.body.classList.add("menu-open");

            /* Fokus ke tautan pertama */

            const firstLink = sideMenu.querySelector("a");

            if (firstLink) {
                firstLink.focus({ preventScroll: true });
            }
        }

        /* =====================================================
           CLOSE MENU
        ===================================================== */

        function closeMenu(restoreFocus = false) {

            menuButton.classList.remove("active");

            sideMenu.classList.remove("active");
            overlay.classList.remove("active");

            sideMenu.setAttribute("aria-hidden", "true");
            sideMenu.setAttribute("inert", "");

            overlay.setAttribute("aria-hidden", "true");

            menuButton.setAttribute("aria-expanded", "false");
            menuButton.setAttribute("aria-label", "Buka menu");

            document.body.classList.remove("menu-open");

            /* Kembalikan fokus ke tombol hamburger */

            if (restoreFocus) {
                menuButton.focus({ preventScroll: true });
            }

            /* Periksa kembali tabrakan konten */

            window.setTimeout(checkHamburgerCollision, 50);
        }

        /* =====================================================
           TOGGLE MENU
        ===================================================== */

        menuButton.addEventListener("click", function () {

            if (sideMenu.classList.contains("active")) {
                closeMenu(true);
            } else {
                openMenu();
            }

        });

        /* =====================================================
           OVERLAY CLICK
        ===================================================== */

        overlay.addEventListener("click", function () {
            closeMenu(true);
        });

        /* =====================================================
           MENU LINKS
        ===================================================== */

        sideMenu.querySelectorAll("a").forEach(function (link) {

            link.addEventListener("click", function () {
                closeMenu(false);
            });

        });

        /* =====================================================
           SCROLL DETECTION
        ===================================================== */

        window.addEventListener(
            "scroll",
            checkHamburgerCollision,
            { passive: true }
        );

        /* =====================================================
           RESIZE DETECTION
        ===================================================== */

        window.addEventListener(
            "resize",
            checkHamburgerCollision
        );

        /* =====================================================
           ESCAPE KEY
        ===================================================== */

        document.addEventListener("keydown", function (event) {

            if (
                event.key === "Escape" &&
                sideMenu.classList.contains("active")
            ) {
                closeMenu(true);
            }

        });

        /* =====================================================
           INITIAL CHECK
        ===================================================== */

        checkHamburgerCollision();
    </script>

</body>
</html>
